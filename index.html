/* Inter from its designer's own site. The Google Fonts copy leaves out the alternate letters the titles use. */
@font-face { font-family: InterVariable; font-style: normal; font-weight: 100 900; font-display: swap; src: url("https://rsms.me/inter/font-files/InterVariable.woff2?v=4.1") format("woff2"); }
@font-face { font-family: InterVariable; font-style: italic; font-weight: 100 900; font-display: swap; src: url("https://rsms.me/inter/font-files/InterVariable-Italic.woff2?v=4.1") format("woff2"); }
/* Layout: a six-generation chart you can drag, with one reading panel beside it (wide) or sliding in from the right (narrow). */
/* ---- The design system (2026-10-24) ----
   One set of steps for everything on the page. Use these tokens only: no other font size, weight, gap or radius.
   Type scale and spacing follow Untitled UI. Colours, fonts and the feel follow framer.com:
   Inter for titles and names, set as in the Swiper template, Inter for text,
   black and white with grey, black pill buttons, solid grey and yellow pills (never an outline),
   and one bright colour for each side of the family: violet for the mother's side, azure for the father's side.
   Sizes:    xs 12 · sm 14 · md 16 · lg 18 · xl 24 · 2xl 36 · 3xl 60 (and 11 for small capitals inside a pill)
   Weights:  400 text · 500 labels and buttons · 600 sub-titles and names · 700 page and section titles, text in a pill, and text in a side's colour
   Spacing:  4 · 8 · 12 · 16 · 20 · 24 · 32 · 40 · 48 · 64 · 80 · 96
   Radius:   8 · 12 · 16 · 24 · pill */
:root {
  --fs-2xs: 11px;           /* small capitals inside a pill only */
  --fs-xs: 12px;  --lh-xs: 18px;
  --fs-sm: 14px;  --lh-sm: 20px;
  --fs-md: 16px;  --lh-md: 24px;
  --fs-lg: 18px;  --lh-lg: 28px;
  --fs-xl: 24px;  --lh-xl: 32px;
  --fs-2xl: 36px; --lh-2xl: 44px;
  --fs-3xl: 60px; --lh-3xl: 60px;
  --fw-text: 400; --fw-label: 500; --fw-title: 600; --fw-bold: 700; --fw-heavy: 700; --fw-pill: var(--fw-bold);
  --tr-display: -.02em;   /* titles of 24px and more, as in the Swiper template */
  --tr-text: -.006em;     /* all other text, as on framer.com */
  --tr-caps: .04em;       /* small capitals labels */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
  --sp-8: 32px; --sp-10: 40px; --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-pill: 999px;
  --display: "InterVariable", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* Titles and names copy the Swiper template: Inter in its text cut, with four alternate letters on,
     among them the single-storey "a". */
  --display-ff: "cv03", "cv04", "cv09", "cv11";
  --body: "InterVariable", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: var(--body);

  /* light mode: white and grey */
  --bg: #FFFFFF;
  --band: #F5F5F5;       /* a grey section band, from edge to edge */
  --band-blue: #6E8BA9;  /* the places band: the dusty blue of the Gen Studio template */
  --band-paper: #F1E8D2;  /* the ages band: faded old paper */
  --band-clay: #A3412F;  /* the Notable band: the red of the woman's top in the Gen Studio template */
  --card: #FFFFFF;       /* a card */
  --surface: #FFFFFF;    /* the reading panel and the password box */
  --chart: #F5F5F5;      /* behind the tree */
  --chart-line: #D4D4D4; /* the lines and dashed borders on the tree */
  --dot: #DCDCDC;        /* the dot grid behind the tree */
  --pill: #E8EAED;       /* a grey pill */
  --line: #E8E8E8;
  --line-2: #D4D4D4;
  --ring: #D4D4D4;       /* the dashed ring around a portrait */
  --ink: #0A0A0A;        /* text */
  --ink-1: #262626;      /* the opening text: close to black */
  --ink-2: #666666;      /* softer text, as framer.com's 60% */
  --ink-3: #757575;      /* small notes */
  --soft: #BDBDBD;       /* the pale half of the page title */
  --btn: #0A0A0A;        /* a pressed button: black, with white text */
  --btn-ink: #FFFFFF;
  --hl: #DAEA56;         /* the yellow highlight */
  --tab-on: #0A0A0A;     /* the open tab on the phone: black and bold, on a yellow pill behind its icon (bright yellow cannot be read on white) */
  --tab-pill: var(--hl);
  --hl-ink: #0A0A0A;
  --mat: #7E3FD6;        /* mother's side: violet */
  --pat: #1D6FE0;        /* father's side: azure */
  --mat-wash: #F3ECFC; --mat-wash-2: #DCC8F8;   /* a card on a chosen line, and the chosen card: a deeper shade */
  --pat-wash: #EAF2FD; --pat-wash-2: #C6DBFA;
  --mat-pastel: #F3ECFC; --pat-pastel: #EAF2FD; --b-pastel: #F0F0F0;   /* the relation box in the panel: a pastel in both modes, with dark text */
  --count-bg: #FFFFFF; --count-ink: #666666;          /* the count pills on the grey chart */
  --bad: #C9372C;
  --shadow: 0 24px 60px rgba(0, 0, 0, .14), 0 2px 6px rgba(0, 0, 0, .06);
  /* older names, kept for the password box */
  --surface-2: var(--band); --surface-3: var(--pill); --gold: var(--ink); --gold-bg: var(--hl); --star: var(--ink);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --band: #161616; --card: #222222; --surface: #202020; --tab-on: #DAEA56; --tab-pill: transparent; --chart: #333333; --dot: #555555; --chart-line: #5E5E5E;
    --pill: #2E2E2E; --line: #262626; --line-2: #3A3A3A; --ring: #4D4D4D;
    --ink: #FFFFFF; --ink-1: #E0E0E0; --ink-2: #999999; --ink-3: #808080; --soft: #4D4D4D;
    --btn: #FFFFFF; --btn-ink: #000000;
    --mat: #B68CFF; --pat: #5C9DFF;
    --mat-wash: #2B1260; --mat-wash-2: #DCCBF7; --pat-wash: #102A5E; --pat-wash-2: #CFE1FB;
    --mat-pastel: #DCCBF7; --pat-pastel: #CFE1FB; --b-pastel: #E6E6E6;
    --count-bg: #4D4D4D; --count-ink: #E6E6E6;
    --bad: #FF7A6E; --shadow: 0 24px 60px rgba(0, 0, 0, .7);
    --band-blue: #3F5973; --band-clay: #5A2B21; --band-paper: #2A2418;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --band: #161616; --card: #222222; --surface: #202020; --tab-on: #DAEA56; --tab-pill: transparent; --chart: #333333; --dot: #555555; --chart-line: #5E5E5E;
  --pill: #2E2E2E; --line: #262626; --line-2: #3A3A3A; --ring: #4D4D4D;
  --ink: #FFFFFF; --ink-1: #E0E0E0; --ink-2: #999999; --ink-3: #808080; --soft: #4D4D4D;
  --btn: #FFFFFF; --btn-ink: #000000;
  --mat: #B68CFF; --pat: #5C9DFF;
  --mat-wash: #2B1260; --mat-wash-2: #DCCBF7; --pat-wash: #102A5E; --pat-wash-2: #CFE1FB;
  --mat-pastel: #DCCBF7; --pat-pastel: #CFE1FB; --b-pastel: #E6E6E6;
  --count-bg: #4D4D4D; --count-ink: #E6E6E6;
  --bad: #FF7A6E; --shadow: 0 24px 60px rgba(0, 0, 0, .7);
  --band-blue: #3F5973; --band-clay: #5A2B21; --band-paper: #2A2418;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }   /* the full-width Notable rail must not make the page scroll sideways */
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: var(--fs-md); line-height: var(--lh-md); font-weight: var(--fw-text); letter-spacing: var(--tr-text); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
button { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: inherit; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.wrap { max-width: 1700px; margin-inline: auto; padding-inline: clamp(16px, 3vw, 40px); padding-block: var(--sp-10) var(--sp-24); display: flex; flex-direction: column; gap: var(--sp-24); }

/* ---- pills: one shape for every tag on the page ----
   A solid fill and bold text, never an outline. Grey for plain facts, yellow for a highlight.
   What a person is to Tim is never a pill: it is bold text in the side's colour. */
.eyebrow, .star, .kids-pill, .badge, .unv, .ages .up, .sub-count, .region b { display: inline-block; padding: 7px 12px; border-radius: var(--r-pill); background: var(--pill); color: var(--ink); font-family: var(--body); font-size: var(--fs-xs); line-height: 1; font-weight: var(--fw-pill); letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle; text-box: trim-both cap alphabetic; }
/* Without text-box support, plain line boxes leave a little more room under the letters than above. */
@supports not (text-box: trim-both cap alphabetic) { .eyebrow, .star, .kids-pill, .badge, .unv, .ages .up, .sub-count, .region b { padding-block: 5px 4px; } }
/* a pill in the yellow highlight */
.badge.gold, .ages .up { background: var(--hl); color: var(--hl-ink); }
/* a pill in the side's colour */
.region b { padding: 6px 10px; font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: var(--tr-caps); }   /* small capitals, like the count pills */
.region.m b { background: var(--mat); color: #FFFFFF; }
.region.p b { background: var(--pat); color: #FFFFFF; }
:root[data-theme="dark"] .region b { color: #000000; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .region b { color: #000000; } }

/* ---- titles and text ---- */
.eyebrow { margin: 0; text-transform: uppercase; letter-spacing: var(--tr-caps); }
/* The page title: capitals in two tones, with a star between the two family names. */
h1 { font-family: var(--display); font-feature-settings: var(--display-ff); font-optical-sizing: none; font-weight: var(--fw-heavy); font-size: clamp(40px, calc(2.42vw + 31px), var(--fs-3xl)); line-height: 1.05; letter-spacing: var(--tr-display); text-transform: none; margin: var(--sp-6) 0 0; text-wrap: balance; }
/* The title stays on one line: 60px on a wide screen, a little smaller as the window narrows. A phone may wrap it. */
@media (min-width: 720px) { h1 { white-space: nowrap; } }
/* the title shrinks gently with the window: 60px from 1200px wide, about 50px at 800px, and never under 40px on a phone */
h1 .h-soft { color: var(--soft); }
h2 { font-family: var(--display); font-feature-settings: var(--display-ff); font-optical-sizing: none; font-weight: var(--fw-title); font-size: var(--fs-xl); line-height: var(--lh-xl); letter-spacing: var(--tr-display); margin: 0; text-wrap: balance; }
h3 { font-size: var(--fs-xs); line-height: var(--lh-xs); font-weight: var(--fw-label); letter-spacing: var(--tr-caps); text-transform: uppercase; color: var(--ink-3); margin: 0 0 var(--sp-2); }
/* ---- the photo strip under the title ----
   Instant photos drift slowly from right to left, from screen edge to screen edge. Each sits a little crooked.
   A photo comes into view undeveloped, a flat silver grey, and develops over a few seconds.
   A hover develops it at once, lifts it and sets it straight; the strip keeps moving. */
.snaps { --gut: calc(max(0px, (100vw - 1700px) / 2) + clamp(16px, 3vw, 40px)); width: 100vw; margin: var(--sp-10) 0 0 calc(-1 * var(--gut)); overflow-x: clip; overflow-y: visible; padding-block: var(--sp-6) var(--sp-8); }   /* clipped only at the sides, so a lifted photo's shadow can spill below the strip */
.snaps-track { display: flex; gap: var(--sp-6); width: max-content; padding-left: var(--sp-8); animation: snaps-drift var(--drift, 100s) linear infinite; }
@keyframes snaps-drift { to { transform: translateX(-50%); } }
/* the card: an off-white with a touch of warmth, like an old instant print, not stark white */
.snap { flex: none; display: block; width: 124px; padding: 11px 11px 0; background: #F2EEE4; border: 0; border-radius: 3px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 10px 24px rgba(0, 0, 0, .12); transform: rotate(var(--r)); transition: transform .45s cubic-bezier(.34, 1.56, .64, 1), box-shadow .3s; cursor: pointer; color: #2A2A2A; text-align: left; }
.snap:hover, .snap:focus-visible { transform: translateY(-8px) rotate(0deg) scale(1.04); box-shadow: 0 2px 4px rgba(0, 0, 0, .08), 0 20px 40px rgba(0, 0, 0, .18); }
.snap-pic { position: relative; display: block; aspect-ratio: 1; overflow: hidden; background: #1A1A1A; }
.snap-pic canvas { display: block; width: 100%; height: 100%; }
/* the name writes itself from left to right while the photo develops, over the same time */
.snap .snap-name { clip-path: inset(0 100% 0 0); transition: clip-path 2s cubic-bezier(.45, 0, .55, 1); }
.snap.writ .snap-name { clip-path: inset(0 0 0 0); }
/* the name looks written in pencil: Caveat in graphite grey. The graphite is a coarse grain with gaps,
   so the paper shows through the strokes, as it does under a pencil. The grain is an SVG noise pattern, and the letters
   are cut from it (background-clip: text). */
.snap .snap-name { font-family: "Caveat", "Bradley Hand", "Segoe Print", cursive; font-size: 16px; line-height: 1.1; font-weight: 400; color: #5A5A60;

/* ---- the tree ---- */

.card.unknown { border-style: dashed; }
/* a relative who is not Tim's direct ancestor: a dashed card, like the dashed boxes. Dashed cards are solid grey, so the dots do not show through. */
.card.aside { border-style: dashed; border-color: var(--line-2); background: var(--chart); box-shadow: none; }
/* an empty box for an ancestor who is not found */
.card.gapbox { border-style: dashed; border-color: var(--line-2); background: var(--chart); box-shadow: none; cursor: default; }
.card.gapbox:hover { border-color: var(--line-2); }
.card.gapbox .nm { font-style: italic; font-weight: var(--fw-label); color: var(--ink-2); }
.card.gapbox .avatar { background: transparent; }
/* A chosen line: its cards take a wash of the side's colour (light in light mode, dark blue or dark purple in dark mode),
   with their usual grey border. The chosen card takes the same wash and exactly the border of a chosen box:
   thick, black (white in dark mode). Its name takes the yellow highlight, as the title of a chosen box does.
   The other cards fade back. Tim set this on 2026-10-24. */
.canvas.has-sel .card:not(.on-path) { opacity: .6; }
.canvas.has-sel .card.on-path:not(.you) { background: var(--wash); }
.canvas.has-sel .card.sel:not(.you), .canvas .card.sel:not(.you) { background: var(--wash-2); border-style: solid; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.canvas.has-sel .card.on-path:not(.you) .yrs, .canvas.has-sel .card.on-path:not(.you) .nee i, .canvas.has-sel .card.on-path:not(.you) .plc { color: var(--ink); }
/* in dark mode the chosen card is a light pastel of its side, so its text turns dark, and its relation takes the side's deep colour */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .canvas .card.sel:not(.you) { --ink: #0A0A0A; --ink-1: #1A1A1A; --ink-2: rgba(10, 10, 10, .68); --ink-3: rgba(10, 10, 10, .6); color: #0A0A0A; --sel-rel: var(--deep); } }
:root[data-theme="dark"] .canvas .card.sel:not(.you) { --ink: #0A0A0A; --ink-1: #1A1A1A; --ink-2: rgba(10, 10, 10, .68); --ink-3: rgba(10, 10, 10, .6); color: #0A0A0A; --sel-rel: var(--deep); }
.canvas .card.sel:not(.you) .rel { color: var(--sel-rel, var(--tint-text)); }
.canvas .card.sel .nmt { background: var(--hl); color: var(--hl-ink); border-radius: 3px; padding: 1px 3px; margin-left: -3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.card-top { display: flex; align-items: flex-start; justify-content: center; gap: var(--sp-1); padding: 6px 0 0; margin-bottom: var(--sp-4); }   /* the portrait in the middle; the words stay left-aligned */
/* A round portrait, with a thin dashed ring a little way out from it.
   The ring is a layer of short arcs (--dash in each --period of the circle), cut down to a thin line by a mask.
   The numbers give dashes about 7 pixels long on each portrait size. */
.avatar { --gap: 6px; --period: 20deg; --dash: 12.5deg; position: relative; flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: var(--fs-lg); font-weight: var(--fw-title); letter-spacing: 0; background: var(--pill); color: var(--ink-2); }
.side-m .avatar { color: var(--mat); }
.side-p .avatar { color: var(--pat); }
.avatar::after { content: ""; position: absolute; inset: calc(-1 * var(--gap)); border-radius: 50%; pointer-events: none; background: repeating-conic-gradient(var(--ring) 0 var(--dash), transparent var(--dash) var(--period)); -webkit-mask: radial-gradient(closest-side, transparent calc(100% - var(--ring-w, 1.3px)), #000 calc(100% - var(--ring-w, 1.3px) + .1px)); mask: radial-gradient(closest-side, transparent calc(100% - var(--ring-w, 1.3px)), #000 calc(100% - var(--ring-w, 1.3px) + .1px)); }
.avatar .ph-one { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; border-radius: 50%; }
.avatar.has-photo { display: block; }
.avatar .ph-clip { position: absolute; inset: 0; overflow: hidden; border-radius: 50%; }
.ph-tile { position: absolute; max-width: none; filter: grayscale(1) contrast(1.05); }
/* A star before a name marks a notable person, on a chart card and on a card in the "Notable" row.
   It sits in a small yellow disc, part of the name, on the same line. The star is drawn (an svg), not a character:
   the font has no star, so each phone drew one from another font, at its own size and place. */
.st { display: inline-grid; place-items: center; width: 1.25em; height: 1.25em; margin-right: .15em; border-radius: 50%; background: var(--hl); color: var(--hl-ink); font-size: .75em; line-height: 1; vertical-align: .1em; }
.st svg { display: block; width: 72%; height: 72%; fill: currentColor; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
/* the "?" beside a likely person: the same disc as the star, in grey */
.lk { display: inline-grid; place-items: center; width: 1.25em; height: 1.25em; margin-right: .15em; border-radius: 50%; background: var(--pill); color: var(--ink); font-family: var(--body); font-size: .75em; font-weight: var(--fw-bold); line-height: 1; vertical-align: .1em; }
/* the plus beside an adopted person: the emoji in its text form, so it takes the text colour in dark mode */
.ad { font-size: .85em; line-height: 1; margin-right: .1em; }
/* Card text, by weight: 1 the name. 2 the surname at birth, in bold.
   3 the relation to Tim, in bold in the side's colour at the foot. The years and the place are small and plain. */
.card .nm { font-family: var(--display); font-feature-settings: var(--display-ff); font-optical-sizing: none; font-weight: var(--fw-title); font-size: var(--fs-sm); line-height: var(--lh-sm); }
.card .nee { font-size: var(--fs-xs); line-height: var(--lh-xs); font-weight: var(--fw-title); color: var(--ink); }
.card .nee i { font-style: italic; font-weight: var(--fw-text); color: var(--ink-3); margin-right: var(--sp-1); }
.card .yrs { margin-top: var(--sp-1); font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.card .plc { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-3); }
/* The relation is bold text in the side's colour. */
.card .rel, .cluster .rel { margin-top: auto; padding-top: var(--sp-2); font-size: var(--fs-xs); line-height: var(--lh-xs); font-weight: var(--fw-bold); color: var(--tint-text, var(--ink-2)); }
/* Tim's own card: the usual card with a thick outline (black, white in dark mode), and his initials on the yellow highlight. */
.card.you { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.card.you .avatar { background: var(--hl); color: var(--hl-ink); --ring: var(--ink); }
.card.you .rel { color: var(--ink); }

/* ---- reading panel ---- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); }
.panel-inner { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-6); font-size: var(--fs-sm); line-height: var(--lh-sm); }
.panel-close { display: none; }
.p-head { display: flex; flex-direction: column; gap: var(--sp-5); }
/* the portrait above the name: a round photo, or the initials */
.p-photo { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-2); }
.p-photo .avatar { --gap: 8px; --period: 11.613deg; --dash: 7.2deg; width: 96px; height: 96px; margin: 8px 0 0 8px; font-size: var(--fs-xl); }
.p-photo.you .avatar { background: var(--hl); color: var(--hl-ink); --ring: var(--ink); }
.p-photo small { display: block; font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-3); }
.p-head .nee { font-style: italic; color: var(--ink-2); font-size: var(--fs-sm); }
.p-head .yrs { font-size: var(--fs-sm); color: var(--ink-2); margin-top: var(--sp-1); font-variant-numeric: tabular-nums; }
.p-badges { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin-top: var(--sp-3); }
.badge { white-space: normal; line-height: 1.35; }
/* why a person is notable: the star, then plain text beside it, never a pill */
.p-notable { display: flex; align-items: baseline; gap: 2px; margin: var(--sp-3) 0 0; font-size: var(--fs-sm); line-height: var(--lh-sm); font-weight: var(--fw-label); color: var(--ink); }   /* a second line starts under the text, not under the star */
.p-notable .st { flex: none; }
/* what the person is to Tim: a box in a pastel of the side's colour, in light and dark mode alike, so its text is always dark */
.relbox { background: var(--pastel, var(--band)); color: #0A0A0A; border-radius: var(--r-lg); padding: var(--sp-4) var(--sp-5); }
/* "Your" in black, the relation in a deep shade of the side's colour that reads on the pastel in both modes */
.relbox .rw { color: var(--deep, inherit); }
.relbox .big { font-family: var(--display); font-feature-settings: var(--display-ff); font-optical-sizing: none; font-size: var(--fs-lg); line-height: var(--lh-lg); font-weight: var(--fw-title); }
.relbox .plain { font-size: var(--fs-sm); line-height: var(--lh-sm); }
.relbox .chain { font-size: var(--fs-xs); line-height: var(--lh-xs); color: #555555; margin-top: var(--sp-2); }
.bio p { margin: 0 0 var(--sp-3); max-width: 62ch; line-height: 22px; }
.bio p:last-child { margin-bottom: 0; }
/* the panel for a box: each brother and sister in turn */
.sibs { display: flex; flex-direction: column; gap: var(--sp-4); }
.sib { border-top: 1px solid var(--line); padding-top: var(--sp-4); }
.sib h4 { margin: 0; font-family: var(--display); font-feature-settings: var(--display-ff); font-optical-sizing: none; font-size: var(--fs-md); line-height: var(--lh-md); font-weight: var(--fw-title); }
.sib .when { margin: 0 0 var(--sp-2); font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sib p { margin: 0 0 var(--sp-2); max-width: 62ch; }
.sib .src { display: block; font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-3); }
.facts { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--sp-4); row-gap: var(--sp-2); font-size: var(--fs-sm); line-height: var(--lh-sm); }
.facts dt { color: var(--ink-3); font-size: var(--fs-xs); }
.facts dd { margin: 0; min-width: 0; }
.facts small { display: block; color: var(--ink-2); font-size: var(--fs-xs); line-height: var(--lh-xs); }
.unv { margin-left: var(--sp-1); padding: 6px 10px; font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: var(--tr-caps); }   /* "Not verified": small capitals, room round them */
.facts .unv-row { margin-bottom: calc(-1 * var(--sp-1)); }
.facts .unv-row .unv { margin-left: 0; }
/* on a move, the pill sits beside its title, in small capitals, and takes a tint of the band */
.places .unv { display: table; margin: 0 0 var(--sp-2); padding: 6px 10px; font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: var(--tr-caps); }   /* "Not verified" on its own line, above the date and route, so it never lands mid-line */
.sec.band.blue .places .unv, .sec.band.clay .places .unv { background: rgba(255, 255, 255, .55); color: #0A0A0A; }   /* see-through white, so the clay shows through; black text in both modes */
.linklist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--sp-2); font-size: var(--fs-sm); }
.linklist a::after { content: " ↗"; color: var(--ink-3); }
.kids { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--sp-2); font-size: var(--fs-sm); }
.kids li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--sp-2); }
.kids button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-family: var(--display); font-feature-settings: var(--display-ff); font-optical-sizing: none; font-size: var(--fs-sm); font-weight: var(--fw-title); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.kids span { font-size: var(--fs-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; }
/* the Family block in the reading panel */
.fam h4 { margin: var(--sp-4) 0 var(--sp-2); font-size: var(--fs-xs); line-height: var(--lh-xs); font-weight: var(--fw-label); color: var(--ink-3); }
.fam h3 + h4 { margin-top: 0; }
.fam-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--sp-1); }
.fam-row { display: flex; align-items: center; gap: var(--sp-3); width: 100%; padding: var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-2); background: var(--band); border: 0; border-radius: var(--r-md); color: var(--ink); text-align: left; cursor: pointer; }
.fam-row:hover { background: var(--pill); }
.fam-row .avatar { width: 36px; height: 36px; font-size: var(--fs-xs); --gap: 0px; --ring: transparent; }
.fam-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fam-txt b { font-family: var(--display); font-feature-settings: var(--display-ff); font-optical-sizing: none; font-size: var(--fs-sm); line-height: var(--lh-sm); font-weight: var(--fw-title); }
.fam-txt small { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-2); }
.line-mark { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-weight: 400; font-style: normal; }
.fam-row .chev { flex: none; font-size: 22px; line-height: 1; color: var(--ink-3); }
.fam-none { padding: var(--sp-2) var(--sp-3); font-size: var(--fs-sm); color: var(--ink-3); background: var(--band); border-radius: var(--r-md); }
.kids-note { margin: var(--sp-2) 0 0; font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-2); max-width: 62ch; }
.gal { display: flex; flex-direction: column; gap: var(--sp-4); }
.gal figure { margin: 0; max-width: 560px; }
.gal img { display: block; width: 100%; height: auto; border-radius: var(--r-md); }
.gal figcaption { font-size: var(--fs-xs); line-height: var(--lh-xs); margin-top: var(--sp-2); }
.gal figcaption small { display: block; font-size: var(--fs-xs); color: var(--ink-2); }

/* ---- sections under the tree ---- */
/* Everyone, by generation: each generation has its own heading, and its people fill as many columns as fit. */
.gen-group { margin-bottom: var(--sp-12); }
.gen-group:last-child { margin-bottom: 0; }
.gen-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); column-gap: var(--sp-10); }
.gen-rows + .gen-rows { margin-top: var(--sp-4); }   /* the mother's side sits under the father's side */
.gen-row { display: flex; flex-direction: column; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line-2); padding: var(--sp-3) 0; cursor: pointer; width: 100%; }
.gen-row:hover .gn { text-decoration: underline; text-underline-offset: 3px; }
.gen-row .gn { font-family: var(--display); font-feature-settings: var(--display-ff); font-optical-sizing: none; font-size: var(--fs-md); line-height: var(--lh-md); font-weight: var(--fw-title); }
.gen-row .gn i { font-family: var(--body); font-weight: var(--fw-text); font-size: var(--fs-xs); line-height: 1; color: var(--ink-2); }   /* line-height 1: the italic does not make its row taller */
.gen-row .gr, .gen-row .gp { font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--ink-2); }   /* three lines: the name, the relation, the place */
/* the relation takes the colour of its side */
.gen-row .gk { font-weight: var(--fw-bold); color: var(--tint-text, var(--ink-2)); }   /* the relation: the same size as the place under it */
.places { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--sp-6); max-width: 76ch; }
.places b { display: block; font-family: var(--display); font-feature-settings: var(--display-ff); font-optical-sizing: none; font-size: var(--fs-md); line-height: var(--lh-md); font-weight: var(--fw-title); }
.places span { font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--ink-2); }
/* the eight great-grandparents: eight white cards on the band */
.places.roots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 232px), 1fr)); gap: var(--sp-4); max-width: none; }
.places.roots li { background: var(--card); border-radius: var(--r-lg); padding: var(--sp-5); }
#ages { max-width: 820px; overflow-x: auto; }
.root-btn { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.root-btn:hover { text-decoration-color: currentColor; }
.ages { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); line-height: var(--lh-sm); }
.ages th, .ages td { text-align: left; padding: var(--sp-3) var(--sp-4) var(--sp-3) 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
.ages thead th { font-size: var(--fs-xs); line-height: var(--lh-xs); font-weight: var(--fw-label); letter-spacing: var(--tr-caps); text-transform: uppercase; color: var(--ink-3); }
.ages tbody th { font-family: var(--display); font-feature-settings: var(--display-ff); font-optical-sizing: none; font-size: var(--fs-md); line-height: var(--lh-md); font-weight: var(--fw-title); }
.ages td { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.ages td.avg { font-family: var(--display); font-feature-settings: var(--display-ff); font-optical-sizing: none; font-size: var(--fs-md); font-weight: var(--fw-title); color: var(--ink); white-space: nowrap; }
.ages .up { margin-left: var(--sp-2); }
.ages .up.down { background: var(--pill); color: var(--ink-2); }
/* Questions and holes: one person under the next, in one column. Their text matches the other sections: an item title, then soft grey text. */
.q-grid { display: flex; flex-direction: column; gap: var(--sp-10); max-width: 76ch; }
.q-group h4 { margin: 0 0 var(--sp-3); font-family: var(--display); font-feature-settings: var(--display-ff); font-optical-sizing: none; font-size: var(--fs-md); line-height: var(--lh-md); font-weight: var(--fw-title); }
.q-group ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--sp-3); }
.q-group label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp-3); align-items: start; font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--ink-2); cursor: pointer; }
.q-group input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--ink); }
.q-group input:checked + span { color: var(--ink-3); text-decoration: line-through; }
.todo { margin: 0; padding-left: var(--sp-5); font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--ink-2); display: flex; flex-direction: column; gap: var(--sp-2); }
footer { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-3); border-top: 1px solid var(--line); padding-top: var(--sp-4); }

@media (max-width: 640px) {
  /* a phone: the section titles step down one place on the scale (the page title shrinks by itself, never under 40px) */
  .sec-title { font-size: var(--fs-xl); line-height: var(--lh-xl); }
  .sec.band { padding-block: var(--sp-16); }
  .wrap { gap: var(--sp-16); }
}
@media (min-width: 1700px) {
  .stage { grid-template-columns: minmax(0, 1fr) 426px; }
  .stage.is-fs .panel { margin: var(--sp-4); }
  .panel { position: sticky; top: var(--sp-4); max-height: calc(100vh - 32px); overflow: auto; }
}
@media (max-width: 1699.98px) {
  /* the reading panel slides in from the right */
  .panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 10; width: min(470px, 92vw); overflow: auto; border-radius: var(--r-xl) 0 0 var(--r-xl); border-width: 0 0 0 1px; box-shadow: var(--shadow); transform: translateX(105%); visibility: hidden; transition: transform .25s ease, visibility .25s; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .panel.open { transform: none; visibility: visible; }
  .panel-close { display: block; width: max-content; position: sticky; top: var(--sp-3); margin: var(--sp-3) var(--sp-3) 0 auto; z-index: 1; background: var(--btn); color: var(--btn-ink); border: 0; border-radius: var(--r-pill); height: 32px; padding: 0 var(--sp-4); cursor: pointer; font-size: var(--fs-sm); font-weight: var(--fw-label); }
}
@media (prefers-reduced-motion: reduce) { .panel, .card { transition: none; } }
/* what Lenis needs: the page keeps its own height, and the browser's own smooth scroll stays off while Lenis runs */
html.lenis, html.lenis body { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto !important; }
.lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
.lenis.lenis-stopped { overflow: hidden; }

/* ---- the phone: an app like a map ----
   Up to 760 px wide the page turns into an app. The tree fills the screen like a map, with the search at the top,
   the light or dark switch at the top right and the zoom at the bottom right. A person opens full screen, with a Back
   button. The other sections sit behind five tabs along the bottom. Tim asked for this on 2026-10-25.
   Above 760 px nothing here applies: the website stays as it is. */
.tabbar, .panel-close .pc-back, .gaps-btn .sh, .fs-btn { display: none; }
/* Opened from a home-screen icon, iOS 26 makes the screen short by the status bar's height while the page is
   shorter than the screen (WebKit bug 301108), so the tabs stopped above a strip of empty space. A page at least
   as tall as the screen gets the whole screen. The cap keeps a page with a solid status bar from scrolling (WebKit bug 316008). */
@media (display-mode: standalone) {
  html { min-height: min(100lvh, calc(100% + env(safe-area-inset-top))); }
}
@media (max-width: 760px) {
  /* the tab row, then a strip that keeps the labels clear of the iPhone's home bar (20 px of its 34 px inset is enough) */
  :root { --home: max(0px, env(safe-area-inset-bottom, 0px) - 14px); --tabbar: calc(58px + var(--home)); --safe-top: env(safe-area-inset-top, 0px); }
  [data-tab]:not(.on) { display: none !important; }
  .sec:not(.band), footer[data-tab] { background-color: var(--bg); }   /* the page's background follows the tab's top colour (for the status bar); these keep the page colour */
  body { padding-bottom: var(--tabbar); }
  .wrap { gap: 0; padding-block: 0; }
  .menu { display: none; }   /* the tabs take the place of the section menu */
  .topbar { top: calc(12px + var(--safe-top)); right: 12px; }
  body:not([data-view="tree"]) .topbar { display: none; }   /* the light or dark switch and full screen: on the Tree tab only */
  .topbar .theme .lbl { display: none; }
  .topbar .theme button { height: 36px; padding: 0 11px; }
  .fs-btn:not([hidden]) { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0, 0, 0, .12); color: var(--ink); cursor: pointer; }
  .fs-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fs-btn .fs-out, .fs-btn[aria-pressed="true"] .fs-in { display: none; }
  .fs-tip:not([hidden]) { position: fixed; z-index: 30; inset: 0; display: grid; place-items: end center; padding: var(--sp-4) var(--sp-4) calc(var(--tabbar) + var(--sp-4)); background: rgba(0, 0, 0, .45); }
  .fs-card { width: 100%; max-width: 420px; padding: var(--sp-6); background: var(--surface); color: var(--ink); border-radius: var(--r-xl); box-shadow: var(--shadow); }
  .fs-card h2 { margin: 0 0 var(--sp-2); }
  .fs-card p, .fs-card ol { margin: 0 0 var(--sp-3); font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--ink-2); }
  .fs-card ol { padding-left: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-1); color: var(--ink); }
  .fs-acts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
  .fs-act { display: grid; place-items: center; height: 44px; border: 0; border-radius: var(--r-pill); background: var(--pill); color: var(--ink); font: inherit; font-size: var(--fs-sm); font-weight: var(--fw-label); text-decoration: none; cursor: pointer; }
  .fs-ok { width: 100%; height: 44px; margin-top: var(--sp-2); border: 0; border-radius: var(--r-pill); background: var(--btn); color: var(--btn-ink); font: inherit; font-weight: var(--fw-label); cursor: pointer; }
  .fs-btn[aria-pressed="true"] .fs-out { display: inline; }

  /* the tab bar: the open tab is one yellow square, its icon and its word together */
  .tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; height: var(--tabbar); padding: 0; background: var(--surface); border-top: 1px solid var(--line); }
  /* each tab fills its cell; its icon and label sit above the iPhone's home bar (the bottom padding) */
  .tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; padding: 0 0 var(--home); background: none; border: 0; border-radius: 0; color: var(--ink-2); font-size: 11px; line-height: 14px; font-weight: var(--fw-label); cursor: pointer; }
  .tabbar .ic { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 15px; }
  .tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar svg .dot { fill: currentColor; stroke: none; }
  /* the open tab: no block behind it; its icon and label get bolder. In dark mode both turn yellow, as on Airbnb.
     In light mode they stay black, with a yellow pill behind the icon only: bright yellow cannot be read on white. */
  .tabbar button[aria-current] { color: var(--tab-on); font-weight: var(--fw-bold); }
  .tabbar button[aria-current] svg { stroke-width: 2.6; }
  .tabbar button[aria-current] .ic { background: var(--tab-pill); }

  /* the Tree tab: the chart fills the screen, like a map */
  body[data-view="tree"] { overflow: hidden; }
  [data-tab="tree"] .sec-title, [data-tab="tree"] .sec-sub, [data-tab="tree"] .hint, .tree-hint { display: none; }
  /* the controls sit in their own bar at the top; the map starts under it (--apphead: the bar's height, set by the page) */
  .tree-scroll { --edge-top: 48px; }   /* the map's top margin on the phone: edgeTop() in the page code */
  .tree-scroll { position: fixed; z-index: 1; inset: var(--apphead, 120px) 0 var(--tabbar) 0; max-height: none !important; border: 0; border-radius: 0; touch-action: pan-x pan-y; }
  .chart-bar { position: fixed; z-index: 5; top: 0; left: 0; right: 0; margin: 0; display: block; padding: calc(12px + var(--safe-top)) 12px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar-left { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .find { order: -1; flex: 0 0 calc(100% - 140px); }   /* the search, like a map's, beside the light or dark switch and the full-screen button */
  .find input { width: 100%; height: 44px; }
  .find-list { min-width: 0; width: calc(100vw - 24px); max-height: 50vh; overscroll-behavior: contain; }   /* the page code ends it above the keyboard */
  .find-list button { padding: 12px; }

  .modes button { padding: 0 var(--sp-3); }
  .modes .lg, .gaps-btn .lg { display: none; }
  .gaps-btn .sh { display: inline; }
  .gaps-btn { height: 40px; padding: 0 var(--sp-3); }
  .map-ctl { display: none; }   /* no zoom or full-screen buttons in the map: two fingers zoom it, and the top bar has full screen */
  html { touch-action: manipulation; }   /* a double tap never zooms the page */

  /* a person: the card opens full screen, with a Back button at the top left */
  .panel { inset: 0; width: 100%; z-index: 20; border-radius: 0; border: 0; }
  .panel-close { margin: var(--sp-3) auto 0 var(--sp-3); }
  .panel-close .pc-x { display: none; }
  .panel-close .pc-back { display: inline; }

  /* the other tabs: an ordinary page, with section titles well above the titles inside them */
  .sec-title { font-size: 32px; line-height: 36px; }
  [data-tab="questions"] { padding-top: calc(32px + var(--safe-top)); padding-bottom: var(--sp-16); }
  footer[data-tab] { padding: var(--sp-6) 0 var(--sp-10); }
  /* the first section of each tab starts 32 px down: the top switches show on the Tree tab only, so nothing needs clearing */
  .sec.band[aria-labelledby="h-holes"], .sec.band[aria-labelledby="h-ages"] { padding-top: calc(32px + var(--safe-top)); }
  /* Notable: a plain list of cards, one under the next, from edge to edge */
  .sec.notable-pin { height: auto !important; padding-block: calc(32px + var(--safe-top)) var(--sp-16); }
  .notable-pin .pin { position: static; min-height: 0; padding-block: 0; }
  .notable-rail { margin: 0; padding: 0; overflow: visible; }
  .notables { flex-direction: column; width: auto; transform: none !important; }
  .notables .notable-chip { width: 100%; }
  /* each card: the portrait on the left, everything else to its right */
  /* the column holds the portrait and its ring (6 px each side), so the space is the same left and right of the ring: 20 px */
  .notable-chip .nc { display: grid; grid-template-columns: 76px minmax(0, 1fr); column-gap: var(--sp-5); align-items: start; padding: var(--sp-5); }
  .notable-chip .nc-head { display: contents; }
  .notable-chip .avatar { grid-row: 1 / span 2; align-self: start; width: 64px; height: 64px; margin: 6px; font-size: var(--fs-lg); --gap: 6px; }
  .notable-chip .nc-id { grid-column: 2; border-top: 0; padding-top: 0; }
  .notable-chip .nc-what { grid-column: 2; margin-top: var(--sp-2); }
}

.lock h1 { font-family: var(--display); font-feature-settings: var(--display-ff); font-optical-sizing: none; font-weight: var(--fw-heavy); font-size: var(--fs-2xl); line-height: var(--lh-2xl); letter-spacing: var(--tr-display); text-transform: none; margin: var(--sp-1) 0 0; text-wrap: balance; }

.lock label { font-size: 13px; font-weight: 600; margin-top: 8px; color: var(--ink); }
.lock input { font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--bg); color: var(--ink); }
.lock input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }

    <input id="lockPw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
