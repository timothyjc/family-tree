        const L = shape(dad), R = shape(mum);
        const colOf = (S, k) => S.find(it => it.o === byId[k]).col;
        const room = r => id === "tim" && r < o.row - 1 ? 2 : 1;   // the empty column between the two sides
        let off = colOf(L, dad) + 1 - colOf(R, mum);
        for (const r of new Set(R.map(it => it.row))) {
          const lr = L.filter(it => it.row === r);
          if (lr.length) off = Math.max(off, Math.max(...lr.map(it => it.col)) + room(r) - Math.min(...R.filter(it => it.row === r).map(it => it.col)));
        }
        for (const it of R) it.col += off;
        items = L.concat(R);
        // a husband sits under his mother and a wife under her father, the parents nearest the partner; Tim sits in the middle
        items.push({ o, row: o.row, col: id === "tim" ? (colOf(L, dad) + colOf(R, mum)) / 2 : isFather(o) ? colOf(R, mum) : colOf(L, dad) });
      } else if (ps.length === 1) {   // one parent known: the child sits under them
        items = shape(ps[0]);
        items.push({ o, row: o.row, col: items.find(it => it.o === byId[ps[0]]).col });
      } else items = [{ o, row: o.row, col: 0 }];
      const me = items[items.length - 1];
      const hs = (hangers[id] || []).slice().sort((x, y) => Math.abs(was.get(x) - was.get(o)) - Math.abs(was.get(y) - was.get(o)));
      for (const h of hs) {
        // the outer side, away from the partner: left of a father, right of a mother. Tim's brother and sister keep their birth order.
        const side = id === "tim" ? (WIDE[h.id] < WIDE[o.id] ? -1 : 1) : isFather(o) ? -1 : 1;
        let c = me.col + side;
        while (items.some(it => it.row === h.row && Math.abs(it.col - c) < 1)) c += side;
        items.push({ o: h, row: h.row, col: c });
      }
      return items;
    };
    const all = shape("tim"), lo = Math.min(...all.map(it => it.col));
    for (const it of all) it.o.col = it.col - lo + 1;

    // Then close the gap inside each couple, from the top row down. The partners move towards each other, with their
    // brothers and sisters, only across empty space. Their child then moves under the parent nearest its own partner,
    // if that spot is free. Nothing moves onto another card.
    const placed = all.map(it => it.o);
    const group = id => [byId[id]].concat((hangers[id] || []).filter(h => h.row === byId[id].row));
    const move = (g, d) => { for (const o of g) o.col += d; };
    const free = (row, cols, own) => cols.every(c => !placed.some(o => o.row === row && !own.includes(o) && Math.abs(o.col - c) < 0.999));
    const couples = Object.entries(parents).filter(([, ps]) => ps.length === 2);
    for (let r = 0; r <= byId.tim.row; r++) {
      for (const [k, ps] of couples) {
        if (byId[ps[0]].row !== r) continue;
        const dad = isFather(byId[ps[0]]) ? byId[ps[0]] : byId[ps[1]], mum = dad === byId[ps[0]] ? byId[ps[1]] : byId[ps[0]];
        const gap = mum.col - dad.col - 1;
        if (gap > 0.01 && !placed.some(o => o.row === r && o.col > dad.col + 0.01 && o.col < mum.col - 0.01)) {
          move(group(dad.id), gap / 2);
          move(group(mum.id), -gap / 2);
        }
        const kid = byId[k], gk = group(k);
        const d = (k === "tim" ? (dad.col + mum.col) / 2 : isFather(kid) ? mum.col : dad.col) - kid.col;
        if (Math.abs(d) > 0.01 && free(kid.row, gk.map(o => o.col + d), gk)) move(gk, d);
      }
    }
    const lo2 = Math.min(...placed.map(o => o.col));
    for (const o of placed) o.col += 1 - lo2;
  }

  // The father's side is on the left and the mother's side on the right. In every couple the father sits on the left,
  // so the Clark line is at the top left. Tim asked for this on 2026-10-24.
  // The columns in PEOPLE, CLUSTERS and WIDE still put the mother's side on the left. arrange() turns them round:
  // it mirrors the whole chart, then, from Tim's parents up, turns round each couple whose mother is on the left.
  // A couple turns with everything above it and everything that hangs on it: brothers and sisters, a first wife.
  const isFather = o => /father/i.test(o.who || o.rel || "");
  function arrange() {
    const items = PEOPLE.filter(q => !q.mini).concat(CLUSTERS, GAPS);
    const lo = Math.min(...items.map(o => o.col)), hi = Math.max(...items.map(o => o.col));
    for (const o of items) o.col = lo + hi - o.col;
    const { parents, hangers } = relations(true);
    const branch = id => byId[id] ? [byId[id]].concat(hangers[id] || [], ...(parents[id] || []).map(branch)) : [];
    const couples = Object.values(parents).filter(ps => ps.length === 2).sort((x, y) => byId[y[0]].row - byId[x[0]].row);
    for (const [a, b] of couples) {
      const dad = isFather(byId[a]) ? byId[a] : byId[b], mum = dad === byId[a] ? byId[b] : byId[a];
      if (dad.col < mum.col) continue;
      const set = [...new Set(branch(a).concat(branch(b)))];
      const l = Math.min(...set.map(o => o.col)), r = Math.max(...set.map(o => o.col));
      for (const o of set) o.col = l + r - o.col;
    }
  }

  const place = p => { const q = PLACES[p.id]; return q ? (q.to ? q.from + " → " + q.to : q.from) : p.country; };
  // The years on a card: "1817–1894 (77)". The number in brackets is the age at death, worked out from the two years.
  // "c." means about. A lone "?" means the year is not found. A year from a family tree shows no mark here; the panel marks it "not verified".
  const life = p => {
    if (p.id === "tim") return "this is you";
    const L = LIFE[p.id];
    if (!L || p.many) return p.years;
    const tidy = t => String(t || "").replace(/\?$/, ""), b = tidy(L[0]), d = tidy(L[1]);
    if (d === "living") return b ? "born " + b : "living";
    if (!b && !d) return "dates not found";
    const one = t => /^(c\.)?\d{4}$/.test(t), y = t => +t.match(/\d{4}/)[0];
    return (b || "?") + "–" + (d || "?") + (one(b) && one(d) ? " (" + (y(d) - y(b)) + ")" : "");
  };
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const initials = p => p.unknown ? "?" : (w => w.length > 1 ? w[0][0] + w[w.length - 1][0] : w[0][0])(p.short.split(" ").filter(x => /^[A-Z]/.test(x)));

  let zoom = 1;
  const APP = window.matchMedia ? window.matchMedia("(max-width: 760px)") : { matches: false, addEventListener() {} };   // a phone: the page is an app
  let mapFull = false;   // a computer: the tree fills the screen
  let appCard = false;   // on the phone, an open card has added a step to the browser's history
  const canvas = document.getElementById("canvas");
  const treeScroll = document.getElementById("treeScroll");
  const panel = document.getElementById("panel");
  const panelInner = document.getElementById("panelInner");

  // A photo is one image (photo.src) or a crop from the 256-pixel tiles of a Trove newspaper page (photo.tiles).
  // crop = { x, y, w }: the top-left corner and the width of the crop, in pixels of the joined tiles.
  // ---- photos ----
  // PHOTOS gives each photo's address. In the shared copy a photo is its own locked file ("enc:p/..."), which the
  // page opens only when it shows the photo, so the page itself stays small. A blank image holds the place until then.
  const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
  const photoCache = {};
  const locked = key => String(PHOTOS[key] || "").startsWith("enc:");
  const photoUrl = key => !locked(key) ? Promise.resolve(PHOTOS[key])
    : photoCache[key] || (photoCache[key] = window.openPhoto(PHOTOS[key].slice(4)));
  const imgSrc = key => locked(key) ? `src="${BLANK}" data-ph="${esc(key)}"` : `src="${esc(PHOTOS[key])}"`;
  // Any image added with data-ph gets its photo: a failed photo counts as a broken image, so the page's usual fallback shows.
  const fillPhotos = () => document.querySelectorAll("img[data-ph]").forEach(img => {
    const key = img.dataset.ph;
    img.removeAttribute("data-ph");
    photoUrl(key).then(u => { img.src = u; }, () => img.dispatchEvent(new Event("error")));
  });
  new MutationObserver(fillPhotos).observe(document.body, { childList: true, subtree: true });

  function photoHtml(p, boxW, crop) {
    const ph = p.photo;
    // pos, when given, says which part of the picture sits in the middle of the round frame
    if (ph.img || ph.src) return `<img class="ph-one" ${ph.img ? imgSrc(ph.img) : `src="${esc(ph.src)}"`} alt="" loading="lazy"${ph.pos ? ` style="object-position:${esc(ph.pos)}"` : ""}>`;
    const t = ph.tiles, k = boxW / crop.w;
    let out = "";
    for (let j = 0; j < t.rows; j++) for (let i = 0; i < t.cols; i++) {
      out += `<img class="ph-tile" alt="" loading="lazy" src="https://trove.nla.gov.au/imageservice/nla.news-page${t.page}/tile3-${t.c0 + i}-${t.r0 + j}" style="left:${((i * 256 - crop.x) * k).toFixed(1)}px;top:${((j * 256 - crop.y) * k).toFixed(1)}px;width:${(256 * k).toFixed(1)}px;height:${(256 * k).toFixed(1)}px">`;
    }
    return `<span class="ph-clip">${out}</span>`;
  }

  // The star that marks a notable person. It sits before the name. Tim chose the four-point star on 2026-10-10.
  // The marks are plain characters in the name's own text, so they take its size and line (Tim, 2026-10-25).
  // A no-break space keeps each mark on the line with the first word of the name.
  const STAR = '⭐\u00A0';
  // The medal marks the two record holders in the Notable list: the longest-lived and the earliest-born ancestor. Tim chose it on 2026-10-25.
  const MEDAL = '🏅\u00A0';
  // A grey "?" disc beside a name marks a person who fits by strong signs, but whom no record proves yet. Tim chose it on 2026-10-24.
  const LIKELY = '<span class="lk" aria-label="Likely, not proven" title="Likely, not proven">?</span> ';
  // A plus emoji beside a name marks a person who was adopted. Tim chose it on 2026-10-24.
  const ADOPTED = '<span class="ad" aria-label="Adopted" title="Adopted">➕︎</span> ';

  // The label under a couple. "3 known" means three children are found and there may be more:
  // the pill then says "3 children?", the "?" as plain text. Tim asked for this on 2026-10-24.
  const countLabel = t => {
    const m = String(t).match(/^(\d+) known$/);
    return m ? `<span title="There may be more">${m[1]} ${m[1] === "1" ? "child" : "children"}?</span>` : esc(t);
  };

  // ---- chart ----
  // Solid lines join Tim's direct ancestors. Dashed lines lead to everyone else, and to the empty boxes.
  const onLine = id => LINE.has(id);
  // The two record holders: the direct ancestor who lived longest, and the one born earliest. Each gets the medal, on the
  // tree, in Ancestors by Generation, in the Notable list and in the person's card, with a line that says why (Tim, 2026-10-25).
  const RECORDS = (() => {
    const year = t => { const m = String(t || "").match(/\d{4}/); return m ? +m[0] : null; };
    const about = t => /c\.|\?/.test(t) ? "about " : "";
    const dated = PEOPLE.filter(q => !q.mini && LINE.has(q.id) && q.id !== "tim" && LIFE[q.id]).map(q => ({ q, b: year(LIFE[q.id][0]), d: year(LIFE[q.id][1]) }));
    const oldest = dated.filter(x => x.b && x.d).sort((x, y) => (y.d - y.b) - (x.d - x.b))[0];
    const first = dated.filter(x => x.b).sort((x, y) => x.b - y.b)[0];
    const r = [];
    if (oldest) r.push({ id: oldest.q.id, text: `Lived to about ${oldest.d - oldest.b}, longer than any other direct ancestor on the chart.` });
    if (first) r.push({ id: first.q.id, text: `Born ${about(LIFE[first.q.id][0]) ? "about " : "in "}${first.b}, earlier than any other direct ancestor on the chart.` });
    return r;
  })();
  const recordOf = id => RECORDS.filter(r => r.id === id).map(r => r.text);
  const marks = p => (recordOf(p.id).length ? MEDAL : "") + (p.notable ? STAR : "");   // before a name

  function drawChart(wide) {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    let d = "", dx = "", dg = "", pills = "";
    const links = wide ? GAP_LINKS : [];
    const fams = FAMILIES.filter(f => !(!f.b && links.some(l => l[0] === f.a))).map(f => ({ f, gap: false }))
      .concat(links.map(l => ({ f: { a: l[0], b: l[1], kids: [l[2]] }, gap: true })));
    for (const { f, gap } of fams) {
      const a = byId[f.a], b = f.b ? byId[f.b] : null;   // b is missing when only one parent is known
      const left = b && b.col < a.col ? b : a, right = left === a ? b : a;   // either partner may be on the left
      const yMid = b ? Y(a.row) + CARD_H / 2 : Y(a.row) + CARD_H;
      const x1 = X(left.col) + CARD_W, x2 = b ? X(right.col) : x1, mx = b ? (x1 + x2) / 2 : CX(a.col);
      const busY = Y(a.row) + CARD_H + BUS_AT;
      if (gap) {   // a couple with an empty box. A known parent keeps a solid line to the child.
        const k = byId[f.kids[0]], kx = CX(k.col), down = `M${mx} ${yMid}V${busY}H${kx}V${Y(k.row)}`;
        if (a.who) dg += `M${x1} ${yMid}H${x2}` + down;
        else if (left === a) { d += `M${x1} ${yMid}H${mx}` + down; dg += `M${mx} ${yMid}H${x2}`; }
        else { d += `M${mx} ${yMid}H${x2}` + down; dg += `M${x1} ${yMid}H${mx}`; }
        continue;
      }
      const couple = onLine(f.a) && (!b || onLine(f.b));
      const main = couple ? f.kids.filter(onLine) : [], side = f.kids.filter(k => !main.includes(k));
      const pair = b ? `M${x1} ${yMid}H${x2}` : "", drop = `M${mx} ${yMid}V${busY}`;
      if (couple) d += pair; else dx += pair;
      if (main.length) d += drop; else dx += drop;
      const xs = main.map(k => CX(byId[k].col)).concat(mx);
      const lo = Math.min(...xs), hi = Math.max(...xs);
      d += `M${lo} ${busY}H${hi}`;
      for (const k of main) d += `M${CX(byId[k].col)} ${busY}V${Y(byId[k].row)}`;
      const reach = cx => cx < lo ? `H${lo}` : cx > hi ? `H${hi}` : "";
      for (const k of side) { const cx = CX(byId[k].col); dx += `M${cx} ${Y(byId[k].row)}V${busY}${reach(cx)}`; }
      for (const cid of f.clusters || []) { const c = clById[cid], cx = CX(c.col); dx += `M${cx} ${Y(c.row)}V${busY}${reach(cx)}`; }
      pills += `<span class="kids-pill${main.length ? "" : " side"}" style="left:${mx}px;top:${Y(a.row) + CARD_H + PILL_AT}px">${countLabel(f.count)}</span>`;
    }
    for (const c of CLUSTERS) if (c.anchor) {
      const ax = CX(byId[c.anchor].col), cx = CX(c.col), y = Y(c.row) - 14;
      dx += `M${cx} ${Y(c.row)}V${y}H${ax}V${Y(c.row)}`;
    }
    let html = `<svg class="links" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}"/><path class="extra" d="${dx}"/><path class="gapline" d="${dg}"/></svg>` + pills;
    // The two labels sit above the chart. Each one spans the columns of its side.
    const upper = PEOPLE.filter(q => q.row <= 3).concat(wide ? GAPS : []);
    const region = (side, label) => {
      const cols = upper.filter(q => q.side === side).map(q => q.col), l = Math.min(...cols), r = Math.max(...cols);
      return `<div class="region ${side}" style="left:${X(l)}px;top:${PAD}px;width:${X(r) + CARD_W - X(l)}px"><b>${label}</b></div>`;
    };
    html += region("p", "Father's side") + region("m", "Mother's side");
    for (const p of PEOPLE.filter(q => !q.mini)) {
      const cls = ["card", "side-" + p.side, p.id === "tim" ? "you" : "", p.unknown ? "unknown" : "", LINE.has(p.id) ? "" : "aside"].join(" ").replace(/\s+/g, " ").trim();
      const av = p.photo
        ? `<span class="avatar has-photo" data-fallback="${esc(initials(p))}">${photoHtml(p, 54, p.photo.avatar ? { x: p.photo.avatar.x, y: p.photo.avatar.y, w: p.photo.avatar.d } : null)}</span>`
        : `<span class="avatar">${esc(initials(p))}</span>`;
      html += `<button type="button" class="${cls}" data-id="${p.id}" style="left:${X(p.col)}px;top:${Y(p.row)}px;width:${CARD_W}px;height:${CARD_H}px">
        <span class="card-top">${av}</span>
        <span class="nm">${p.likely ? LIKELY : ""}<span class="nmt">${marks(p)}${esc(p.short)}</span></span>
        ${p.nee ? `<span class="nee"><i>née</i>${esc(p.nee)}</span>` : ""}
        <span class="yrs">${esc(life(p))}</span>
        <span class="plc">${esc(place(p))}</span>
        <span class="rel">${esc(p.rel)}</span>
      </button>`;
    }
    // An empty box for each ancestor who is not found. Like every card, it shows what the person is to Tim.
    const GRAND = ["Great-great-great-grand", "Great-great-grand", "Great-grand", "Grand"];
    if (wide) for (const g of GAPS) {
      html += `<div class="card gapbox side-${g.side}" title="${esc(g.who)} of ${esc(g.of)}" style="left:${X(g.col)}px;top:${Y(g.row)}px;width:${CARD_W}px;height:${CARD_H}px">
        <span class="card-top"><span class="avatar">?</span></span>
        <span class="nm">Not found</span>
        <span class="rel">${GRAND[g.row]}${/father/i.test(g.who) ? "father" : "mother"}</span>
      </div>`;
    }
    for (const c of CLUSTERS) {
      const solo = c.members.filter(k => !byId[k].many), young = c.members.filter(k => byId[k].many);
      html += `<button type="button" class="cluster side-${byId[c.members[0]].side}" data-cluster="${c.id}" data-id="${c.id}" style="left:${X(c.col)}px;top:${Y(c.row)}px;width:${CARD_W}px;min-height:${CARD_H}px">
        <span class="ttl"><span>Siblings</span></span>
        <span class="names" style="grid-template-rows:repeat(${solo.length > 6 ? Math.ceil(solo.length / 2) : Math.max(solo.length, 1)},auto)">${solo.map(k => `<span>${byId[k].adopted ? ADOPTED : ""}${esc(byId[k].short)}</span>`).join("")}</span>
        ${young.map(k => `<span class="many">${esc(byId[k].short)}</span>`).join("")}
        <span class="rel">${esc(c.rel || "")}</span>
      </button>`;
    }
    canvas.innerHTML = html;
    canvas.querySelectorAll(".avatar.has-photo img").forEach(img => {
      img.addEventListener("error", () => { const a = img.closest(".avatar"); if (a) { a.classList.remove("has-photo"); a.textContent = a.dataset.fallback; } });
    });
  }
  // "Missing ancestors" on: the wide layout with empty boxes. Off: the compact layout. It starts off. The choice is saved on the device.
  // The saved name ends in 2, so a choice saved before the change of default on 2026-10-10 is not used.
  let wide = false;
  try { wide = localStorage.getItem("familyTreeGaps2") === "1"; } catch (e) {}
  setLayout(true);
  const WIDE_AT = Object.fromEntries(PEOPLE.filter(q => !q.mini).map(q => [q.id, q.col]));   // the wide columns after arrange(): the order for the lists
  setLayout(wide);
  drawChart(wide);

  // ---- notable ----
  // Ten people who did something notable, then two records that the page works out from the years:
  // the direct ancestor who lived the longest, and the one who was born the earliest. Both change when a date changes.
  const yr = t => { const m = String(t || "").match(/\d{4}/); return m ? +m[0] : null; };
  // A record holder gets the same star as a notable person. The text says why.
  const noteCard = (p, text, record) => {
    const av = p.photo && (p.photo.img || p.photo.src)
      ? `<span class="avatar has-photo" data-fallback="${esc(initials(p))}">${photoHtml(p, 80, null)}</span>`
      : `<span class="avatar">${esc(initials(p))}</span>`;
    return `<button type="button" class="notable-chip side-${p.side}" data-id="${p.id}"><span class="nc">
      <span class="nc-head">${av}<span class="nc-id"><span class="nc-name">${record ? MEDAL : p.notable ? STAR : ""}${esc(p.short)}</span><span class="nc-yrs">${esc(life(p))}</span><span class="nc-rel">${esc(p.rel)}</span></span></span>
      <span class="nc-what">${esc(text)}</span>
    </span></button>`;
  };
  document.getElementById("notables").innerHTML = PEOPLE.filter(p => p.notable)
    .sort((a, b) => NOTABLE_ORDER.indexOf(a.id) - NOTABLE_ORDER.indexOf(b.id))
    .map(p => noteCard(p, p.deed || p.notable)).join("")
    + RECORDS.map(r => noteCard(byId[r.id], r.text, true)).join("");
  document.querySelectorAll("#notables .avatar.has-photo img").forEach(img => {
    img.addEventListener("error", () => { const a = img.closest(".avatar"); if (a) { a.classList.remove("has-photo"); a.textContent = a.dataset.fallback; } });
  });

  // ---- the photo strip under the title ----
  // One instant photo for each person with a portrait. A photo opens that person, as a card does.
  // The set repeats to fill each half of the track, and the track holds two halves. The drift moves it left by one half and starts again,
  // so the loop has no seam.
  // Each photo is drawn on a small canvas. It comes in as a grainy grey-blue print. Once the whole of it is on the screen it develops
  // over DEVELOP seconds, evenly over the whole picture, as a real instant print does, and the grain settles. At the same time the name writes itself from left to right.
  // A hover develops it four times as fast. A photo stays developed as it leaves, and goes back to a blank print only once it has gone off the left edge. Scrolling the page away and back redraws nothing.
  {
    const track = document.getElementById("snapsTrack");
    const DEVELOP = 2.2, GRAIN = 0.07, N = 128;   // seconds; grain strength; canvas pixels
    const EMULSION = [155, 166, 173];   // the grey-blue of a blank print
    // CROP: how each photo fits its square. "contain" shows the whole photo, with black bars where its shape is not square;
    // "cover" fills the square. The zoom trims just enough to hide a photo's own white margin or label, and no more.
    const CROP = { carl: [1.9, 0.52, 0.40, "cover"], johanne: [1.05, 0.5, 0.5, "contain"], alexander: [1.25, 0.5, 0.45, "contain"], keith: [1, 0.5, 0.3, "cover"], bill: [1, 0.5, 0.4, "cover"],
      mum: [1, 0.5, 0.5, "cover"], dad: [1, 0.5, 0.5, "cover"], brother: [1, 0.5, 0.5, "cover"], sister: [1, 0.5, 0.5, "cover"] };
    const SNAPS = PEOPLE.filter(p => p.photo && p.photo.img).map(p => ({ id: p.id, side: p.side, name: p.short, img: p.photo.img }));
    const TILT = [-1.2, 1, -0.9, 1.3, -1.1, 0.8, -1.3, 1.1];   // a slight tilt in degrees, anticlockwise then clockwise in turn; all at the same height
    const half = Array.from({ length: Math.max(2, Math.ceil(16 / SNAPS.length)) }, () => SNAPS).flat();   // about 16 photos: wider than the widest screen
    track.innerHTML = half.concat(half).map((p, k) => {
      const copy = k >= half.length, n = k % half.length;
      return `<button type="button" class="snap side-${p.side}" data-id="${p.id}" data-img="${p.img}"${copy ? ' aria-hidden="true" tabindex="-1"' : ""} style="--r:${TILT[n % TILT.length]}deg"><span class="snap-pic"><canvas width="${N}" height="${N}"></canvas></span><span class="snap-name">${esc(p.name)}</span></button>`;
    }).join("");
    track.style.setProperty("--drift", half.length * 4 + "s");   // 4 seconds for each photo to pass

    // Each photo, cropped into its square once, in grey, on its own canvas. Black bars fill the rest.
    // The page never reads a photo's pixels: a browser forbids that for a page opened from a file. Instead each frame draws
    // the photo, then lays a blank print over it, with the grain, that is more see-through where the print has developed.
    const SRC = {};
    const veil = document.createElement("canvas"); veil.width = veil.height = N;
    const veilCtx = veil.getContext("2d"), veilPx = veilCtx.createImageData(N, N);
    const smooth = v => v <= 0 ? 0 : v >= 1 ? 1 : v * v * (3 - 2 * v);
    const draw = card => {
      const g = card.ctx, src = SRC[card.img], p = card.p, d = veilPx.data;
      const k = src ? smooth(p) : 0;   // 0 = blank, 1 = developed, the same everywhere; until the photo has loaded, the print stays blank
      for (let i = 0; i < N * N; i++) {
        const noise = (Math.random() - 0.5) * 255 * GRAIN * (1 - k);
        d[i * 4] = EMULSION[0] + noise; d[i * 4 + 1] = EMULSION[1] + noise; d[i * 4 + 2] = EMULSION[2] + noise;
        d[i * 4 + 3] = 255 * (1 - k);
      }
      veilCtx.putImageData(veilPx, 0, 0);
      g.clearRect(0, 0, N, N);
      if (src) g.drawImage(src, 0, 0);
      g.drawImage(veil, 0, 0);
    };
    const cards = [...track.querySelectorAll(".snap")].map(el => ({ el, img: el.dataset.img, ctx: el.querySelector("canvas").getContext("2d"), p: 0, on: false, fast: false }));
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    Object.keys(CROP).forEach(key => {
      const im = new Image();
      im.onload = () => {
        const [zoom, ax, ay, fit] = CROP[key];
        const c = document.createElement("canvas"); c.width = c.height = N;
        const g = c.getContext("2d");
        g.fillStyle = "#000"; g.fillRect(0, 0, N, N);
        const k = (fit === "cover" ? Math.max(N / im.width, N / im.height) : Math.min(N / im.width, N / im.height)) * zoom;
        const w = im.width * k, h = im.height * k;
        // the anchor point of the photo sits at the same point of the square, as object-position does
        g.filter = "grayscale(1)";
        g.drawImage(im, (N - w) * ax, (N - h) * ay, w, h);
        SRC[key] = c;
        cards.filter(c => c.img === key).forEach(c => { if (still) { c.p = 1; c.el.classList.add("writ"); } draw(c); });
      };
      photoUrl(key).then(u => { im.src = u; }, () => {});
    });
    cards.forEach(draw);

    // The frame loop runs only while a photo is developing, or a blank one is in view (its grain moves).
    let running = false, then = 0;
    const tick = now => {
      const dt = Math.min(0.05, (now - then) / 1000); then = now;
      let busy = false;
      for (const c of cards) {
        if (!c.on || c.p >= 1) continue;
        c.p = Math.min(1, c.p + dt / DEVELOP * (c.fast ? 4 : 1));
        c.el.classList.add("writ");   // the name writes itself while the photo develops
        draw(c);
        busy = true;
      }
      running = busy;
      if (busy) requestAnimationFrame(tick);
    };
    const wake = () => { if (!running && !still) { running = true; then = performance.now(); requestAnimationFrame(tick); } };
    if (window.IntersectionObserver && !still) {
      const byEl = new Map(cards.map(c => [c.el, c]));
      const seen = new IntersectionObserver(list => list.forEach(x => {
        const c = byEl.get(x.target);
        const r = x.boundingClientRect, blank = () => { c.on = false; c.fast = false; c.p = 0; c.el.classList.remove("writ"); draw(c); };
        if (x.intersectionRatio >= 0.99) { c.on = true; wake(); }   // the whole photo is on the screen: it develops
        else if (!x.isIntersecting && r.right <= 0) blank();   // gone off the left edge: a blank print again, ready for its next pass
        else if (x.isIntersecting && r.right > window.innerWidth) blank();   // sliding in at the right edge: blank until the whole of it is in
        // a photo that leaves because the page scrolls up or down keeps its state, so coming back redraws nothing
      }), { threshold: [0, 0.99] });
      cards.forEach(c => seen.observe(c.el));
    } else cards.forEach(c => { c.p = 1; c.el.classList.add("writ"); draw(c); });
    cards.forEach(c => c.el.addEventListener("pointerenter", () => { c.on = true; c.fast = true; wake(); }));
  }

  // ---- smooth scrolling ----
  // Lenis glides the whole page toward where the wheel sends it, as on realfood.gov. A touch screen keeps its own scroll.
  // The reading panel scrolls by itself (data-lenis-prevent). A pinch on the chart zooms it; Lenis leaves a pinch alone.
  // The wheel is never blocked or ignored. A pinned section (the tree's zoom, the Notable row) settles gently instead:
  // when the page comes to rest within SETTLE of either end of one, it glides on to that end, as ScrollTrigger's snap does.
  const stops = [];   // functions that return [start, end] page positions of a pinned section
  let smooth = null;   // Lenis, once it runs: the section menu glides the page with it
  if (window.Lenis && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const SETTLE = 0.15, REST = 180;   // share of the section near each end; ms without scrolling that counts as rest
    const lenis = smooth = new Lenis({ lerp: 0.1, virtualScroll: ({ event }) => !(event.metaKey && event.target.closest && event.target.closest("#treeScroll")) });   // ⌘ with the wheel over the chart zooms it
    let timer = 0, settling = false;
    lenis.on("scroll", () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (settling) { settling = false; return; }
        const y = window.scrollY;
        for (const f of stops) {
          const [a, b] = f();
          if (!(b > a) || y <= a + 1 || y >= b - 1) continue;
          const d = (y - a) / (b - a);
          const to = d < SETTLE ? a : d > 1 - SETTLE ? b : null;
          if (to !== null) { settling = true; lenis.scrollTo(to, { duration: 0.8 }); }
          return;
        }
      }, REST);
    });
    const raf = t => { lenis.raf(t); requestAnimationFrame(raf); };
    requestAnimationFrame(raf);
  }

  // The Notable row scrolls sideways. While the section is pinned, every SLOW px scrolled down moves the row one pixel left.
  // The slide ends when the last card's right edge meets the page's right margin.
  {
    const pinSec = document.getElementById("notablePin"), pin = pinSec.querySelector(".pin");
    const rail = pinSec.querySelector(".notable-rail"), row = document.getElementById("notables");
    const SLOW = 1.5;
    let slide = 0;
    const measure = () => {
      const pad = parseFloat(getComputedStyle(rail).paddingLeft) || 0;
      slide = Math.max(0, row.scrollWidth - (rail.clientWidth - 2 * pad));
      pinSec.style.height = pin.offsetHeight + slide * SLOW + "px";
      move();
    };
    stops.push(() => { const top = Math.round(pinSec.getBoundingClientRect().top + window.scrollY); return slide ? [top, top + Math.round(slide * SLOW)] : []; });
    const move = () => {
      const x = Math.min(slide, Math.max(0, -pinSec.getBoundingClientRect().top / SLOW));
      row.style.transform = `translateX(${-x}px)`;
    };
    window.addEventListener("scroll", move, { passive: true });
    window.addEventListener("resize", measure);
    if (window.ResizeObserver) new ResizeObserver(measure).observe(rail);
    measure();
  }

  // ---- ancestors by generation ----
  // Direct ancestors only, from Tim's parents back. No brothers, sisters, aunts or uncles. Each heading counts how many are found.
  // The order copies the chart: the father's side first, then the mother's side under it, each from left to right.
  const ANC_NAMES = ["Your great-great-great-grandparents", "Your great-great-grandparents", "Your great-grandparents", "Your grandparents", "Your parents"];
  let list = "";
  for (let r = 4; r >= 0; r--) {
    const found = PEOPLE.filter(q => q.row === r && !q.mini && LINE.has(q.id)).sort((x, y) => WIDE_AT[x.id] - WIDE_AT[y.id]), all = 2 ** (5 - r);
    list += `<div class="gen-group"><h3 class="sub-title">${esc(ANC_NAMES[r])}<span class="sub-count">${found.length} of ${all}</span></h3>`;
    for (const side of ["p", "m"]) {
      list += `<div class="gen-rows">` + found.filter(p => p.side === side).map(p =>
        `<button type="button" class="gen-row" data-id="${p.id}"><span class="gn">${marks(p)}${esc(p.short)}${p.nee ? ` <i>née ${esc(p.nee)}</i>` : ""}</span><span class="gr"><span class="side-${p.side}"><span class="gk">${esc(p.rel)}</span></span></span><span class="gp">${esc(place(p))}</span></button>`).join("") + `</div>`;
    }
    list += "</div>";
  }
  document.getElementById("genList").innerHTML = list;

  // ---- how long each generation lived ----
  // Worked out from LIFE for the direct ancestors, so the table stays current when a date changes.
  const yearOf = t => { const m = String(t || "").match(/\d{4}/); return m ? +m[0] : null; };
  const AGE_ROWS = [[3, "Grandparents", 4], [2, "Great-grandparents", 8], [1, "Great-great-grandparents", 16], [0, "Great-great-great-grandparents", 32]];
  // The usual age: what a person of 25 could expect to reach, in the year when the ancestor was 25.
  const usualAt = (rows, y) => {
    if (y <= rows[0][0]) return rows[0][1];
    for (let i = 1; i < rows.length; i++) if (y <= rows[i][0]) { const [y0, v0] = rows[i - 1], [y1, v1] = rows[i]; return v0 + (v1 - v0) * (y - y0) / (y1 - y0); }
    return rows[rows.length - 1][1];
  };
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  // Your dad's side and your mum's side, under the table: the same ancestors, split by side (Tim asked on 2026-10-25).
  // The closing line says whether the gap could be chance: Welch's t, with 2 as the rough line for "unlikely to be chance".
  function sidesHtml() {
    const known = side => PEOPLE.filter(q => !q.mini && q.row <= 3 && LINE.has(q.id) && q.side === side && LIFE[q.id])
      .map(q => { const b = yearOf(LIFE[q.id][0]), d = yearOf(LIFE[q.id][1]); if (!b || !d) return null;
        const y = b + 25, aus = /Australia/.test(q.country) && y >= 1921;
        return { age: d - b, usual: usualAt(aus ? USUAL_AGE.australia : USUAL_AGE.england, y) }; }).filter(Boolean);
    const sides = [["p", "Your dad's side"], ["m", "Your mum's side"]].map(([side, label]) => {
      const k = known(side), ages = k.map(x => x.age), avg = mean(ages);
      const sd = Math.sqrt(ages.reduce((t, a) => t + (a - avg) ** 2, 0) / Math.max(1, ages.length - 1));
      return { side, label, n: ages.length, avg, sd, ahead: Math.round(avg - mean(k.map(x => x.usual))) };
    }).filter(x => x.n >= 2);
    if (sides.length < 2) return "";
    const [a, b] = sides, gap = Math.round(Math.abs(a.avg - b.avg));
    const t = Math.abs(a.avg - b.avg) / Math.sqrt(a.sd ** 2 / a.n + b.sd ** 2 / b.n);
    const longer = a.avg >= b.avg ? a : b;
    const sum = gap === 0 ? "Both sides lived about as long as each other."
      : `${longer.label} lived about ${gap} year${gap === 1 ? "" : "s"} longer on average. ` +
        (t < 2 ? `With only ${a.n} and ${b.n} ages known, a gap this size could easily be chance.` : "The gap is large enough that it is unlikely to be chance alone.");
    return `<div class="ages ages-sides"><h3 class="sub-title">Your dad's side and your mum's side</h3><div class="side-rows">` +
      sides.map(x => `<div class="side-row"><span class="side-${x.side}"><span class="gk">${x.label}</span></span>` +
        `<span class="avg">${Math.round(x.avg)}${x.ahead > 0 ? `<span class="up">+${x.ahead}</span>` : ""}</span><span class="sn">${x.n} ages</span></div>`).join("") +
      `</div><p class="ages-sum">${sum}</p></div>`;
  }
  document.getElementById("ages").innerHTML = `<table class="ages"><thead><tr><th>Generation</th><th>Average age</th><th>Usual then</th><th>Youngest to oldest</th><th>Known ages</th></tr></thead><tbody>` +
    AGE_ROWS.map(([r, label, total]) => {
      const known = PEOPLE.filter(q => !q.mini && q.row === r && LINE.has(q.id) && LIFE[q.id])
        .map(q => { const b = yearOf(LIFE[q.id][0]), d = yearOf(LIFE[q.id][1]); if (!b || !d) return null;
          const y = b + 25, aus = /Australia/.test(q.country) && y >= 1921;
          return { age: d - b, usual: usualAt(aus ? USUAL_AGE.australia : USUAL_AGE.england, y) }; }).filter(Boolean);
      if (!known.length) return "";
      const ages = known.map(k => k.age), avg = mean(ages), usual = mean(known.map(k => k.usual)), diff = Math.round(avg - usual);
      const tag = diff > 0 ? `<span class="up">+${diff}</span>` : diff < 0 ? `<span class="up down">−${-diff}</span>` : "";
      return `<tr><th>${label}</th><td class="avg">${Math.round(avg)}${tag}</td><td>${Math.round(usual)}</td><td>${Math.min(...ages)} to ${Math.max(...ages)}</td><td>${ages.length} of ${total}</td></tr>`;
    }).join("") + "</tbody></table>";
  document.getElementById("agesSides").innerHTML = sidesHtml();

  // ---- the eight great-grandparents ----
  document.getElementById("roots").innerHTML = ROOTS.map(r =>
    `<li><b><button type="button" class="root-btn" data-id="${r[0]}">${esc(byId[r[0]].name)}</button></b><span>${esc(r[1])}</span></li>`).join("");

  // ---- questions for the family, and the holes ----
  let asked = [];
  try { asked = JSON.parse(localStorage.getItem("familyTreeAsked") || "[]"); } catch (e) {}
  const qList = document.getElementById("qList");
  qList.innerHTML = QUESTIONS.map(g => `<div class="q-group"><h4>${esc(g.who)}</h4><ul>${g.items.map(q =>
    `<li><label><input type="checkbox" data-q="${esc(q[0])}"${asked.includes(q[0]) ? " checked" : ""}><span>${esc(q[1])}</span></label></li>`).join("")}</ul></div>`).join("");
  qList.addEventListener("change", () => {
    const done = [...qList.querySelectorAll("input:checked")].map(i => i.dataset.q);
    try { localStorage.setItem("familyTreeAsked", JSON.stringify(done)); } catch (e) {}
  });
  document.getElementById("holeList").innerHTML = HOLES.map(h =>
    `<div class="q-group"><h4>${esc(h[0])}</h4><ul class="todo">${h[1].map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`).join("");

  // ---- moves between countries ----
  document.getElementById("moves").innerHTML = MOVES.map(m =>
    `<li>${m.unverified ? '<div class="unv">Not verified</div>' : ""}<b>${esc(m.when)} · ${esc(m.from)} → ${esc(m.to)}</b><span>${esc(m.text)}</span></li>`).join("");

  // ---- reading panel ----
  // A row in a family list: one button with the portrait, the name, what they are to this person and their years,
  // and an arrow. A tap opens that person. Rows look like rows, so it is plain that they lead somewhere.
  const male = q => /father|uncle|brother|\bson\b|husband|nephew/i.test(q.rel || "") || q.id === "tim";
  const female = q => /mother|aunt|sister|daughter|wife|niece/i.test(q.rel || "");
  // Tim's mark for a person on his line (his direct ancestors): the DNA he carries. It replaces the words "your line".
  const LINE_MARK = `<span class="line-mark" role="img" aria-label="your line" title="Your line">🧬</span>`;
  const onMyLine = id => LINE.has(id) && id !== "tim";
  const famItem = (k, label) => {
    const q = byId[k];
    if (!q || q.who) return "";
    const what = typeof label === "function" ? label(q) : label;
    const av = q.photo && (q.photo.img || q.photo.src)
      ? `<span class="avatar has-photo" data-fallback="${esc(initials(q))}">${photoHtml(q, 36, null)}</span>`
      : `<span class="avatar">${esc(q.many ? "+" : initials(q))}</span>`;
    const bits = [what, life(q)].filter(Boolean).join(" · ");
    const mark = onMyLine(k) ? (bits ? " · " : "") + LINE_MARK : "";
    return `<li><button type="button" class="fam-row side-${q.side}" data-id="${k}">${av}<span class="fam-txt"><b>${esc(q.name)}</b><small>${esc(bits)}${mark}</small></span><span class="chev" aria-hidden="true">›</span></button></li>`;
  };
  const sibWord = q => q.many ? "" : male(q) ? "Brother" : female(q) ? "Sister" : "";
  const kidWord = q => q.many ? "" : q.id === "tim" ? "You" : male(q) ? "Son" : female(q) ? "Daughter" : "";
  // the family a person was born into
  const birthOf = id => FAMILIES.find(f => (f.all || []).includes(id) || f.kids.includes(id));
  const famParents = id => {
    const f = birthOf(id);
    if (!f) return LINE.has(id) && id !== "tim" ? `<h4>Parents</h4><ul class="fam-list"><li class="fam-none">Not found yet</li></ul>` : "";
    const pa = [f.a, f.b].filter(k => k && byId[k] && !byId[k].who), dad = pa.find(k => isFather(byId[k])), mum = pa.find(k => k !== dad);
    const rows = (dad ? famItem(dad, "Father") : `<li class="fam-none">Father not found yet</li>`)
      + (mum ? famItem(mum, "Mother") : `<li class="fam-none">Mother not found yet</li>`);
    return `<h4>Parents</h4><ul class="fam-list">${rows}</ul>`;
  };
  const famSiblings = id => {
    const f = birthOf(id);
    const sibs = f ? (f.all && f.all.length ? f.all : f.kids).filter(k => k !== id) : [];
    return sibs.length ? `<h4>Brothers and sisters · ${sibs.length}</h4><ul class="fam-list">${sibs.map(k => famItem(k, sibWord)).join("")}</ul>` : "";
  };

  function renderPanel(p) {
    // The portrait sits above the name, always: the photo, or the initials when there is none. The same round frame as on the cards.
    const av = p.photo && (p.photo.img || p.photo.src || p.photo.avatar)
      ? `<span class="avatar has-photo" data-fallback="${esc(initials(p))}">${photoHtml(p, 96, p.photo.avatar ? { x: p.photo.avatar.x, y: p.photo.avatar.y, w: p.photo.avatar.d } : null)}</span>`
      : `<span class="avatar">${esc(initials(p))}</span>`;
    const photo = `<div class="p-photo side-${p.side}${p.id === "tim" ? " you" : ""}">${av}${p.photo ? `<small>Photo: ${esc(p.photo.credit)}</small>` : ""}</div>`;
    const facts = p.facts.length ? `<section><h3>Records</h3><dl class="facts">${p.facts.map(f =>
      // a fact from an online family tree gets a "Not verified" pill on a row of its own, just above it, so the label still lines up with the date
      (f[3] ? '<dt class="unv-row"></dt><dd class="unv-row"><span class="unv">Not verified</span></dd>' : "") +
      `<dt>${esc(f[0])}</dt><dd>${esc(f[1])}<small>${esc(f[2] || "")}</small></dd>`).join("")}</dl></section>` : "";
    const gallery = p.gallery ? `<section><h3>Photographs</h3><div class="gal">${p.gallery.map(g =>
      `<figure><img ${g.img ? imgSrc(g.img) : `src="${esc(g.src)}"`} alt="${esc(g.caption)}" loading="lazy"><figcaption>${esc(g.caption)}<small>${esc(g.credit)}</small></figcaption></figure>`).join("")}</div></section>` : "";
    // Family: the father, the mother, the brothers and sisters, and the children. Each name opens that person,
    // so the reader can walk the family from inside the card. Tim asked for this on 2026-10-25.
    const fams = FAMILIES.filter(f => f.a === p.id || f.b === p.id);
    const kidsOf = fams.map(fam => {
      const other = byId[fam.a === p.id ? fam.b : fam.a];
      const title = fams.length > 1 && other ? "Children with " + other.short.split(" ")[0] : "Children";
      if (!fam.all.length) return `<h4>Marriage to ${esc(other.short.split(" ")[0])} · ${esc(fam.count)}</h4>${fam.note ? `<p class="kids-note">${esc(fam.note)}</p>` : ""}`;
      const n = String(fam.count).replace(/^(\d+) (children|child)$/, "$1").replace(/^(\d+) known$/, "$1 known, perhaps more");
      return `<h4>${esc(title)} · ${esc(n)}</h4><ul class="fam-list">${fam.all.map(k => famItem(k, kidWord)).join("")}</ul>${fam.note ? `<p class="kids-note">${esc(fam.note)}</p>` : ""}`;
    }).join("");
    const kids = `<section class="fam"><h3>Family</h3>${famParents(p.id)}${famSiblings(p.id)}${kidsOf}</section>`;
    const pl = PLACES[p.id] && PLACES[p.id].rows.length ? `<section><h3>Places</h3><dl class="facts">${PLACES[p.id].rows.map(r =>
      `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl></section>` : "";
    const links = p.links.length ? `<section><h3>Links</h3><ul class="linklist">${p.links.map(k =>
      `<li><a href="${esc(SRC[k][1])}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a></li>`).join("")}</ul></section>` : "";
    panelInner.innerHTML = `
      <div class="p-head">${photo}<div>
        <h2>${esc(p.name)}${onMyLine(p.id) ? "&nbsp;" + LINE_MARK : ""}</h2>
        ${p.nee ? `<div class="nee">née ${esc(p.nee)}. Her surname at birth was ${esc(p.nee)}.</div>` : ""}
        <div class="yrs">${esc(life(p))}</div>
        <div class="p-badges"><span class="badge">${esc(place(p))}</span></div>
        ${p.notable ? `<p class="p-notable">${STAR}${esc(p.notable)}</p>` : ""}${recordOf(p.id).map(t => `<p class="p-notable">${MEDAL}${esc(t)}</p>`).join("")}${p.likely ? `<p class="p-notable"><span>${LIKELY}Likely, not proven. ${esc(p.likelyWhy || "")}</span></p>` : ""}
      </div></div>
      <div class="relbox side-${p.side}">
        <div class="big">${p.id === "tim" ? "You" : `Your <span class="rw">${esc(p.rel.toLowerCase())}</span>`}</div>
        <div class="plain">${esc(p.plain)}</div>
        ${p.chain ? `<div class="chain">${esc(p.chain)}</div>` : ""}
      </div>
      ${kids}
      <section class="bio">${p.bio.map(t => `<p>${esc(t)}</p>`).join("")}</section>
      ${pl}${gallery}${facts}${links}`;
    panelInner.querySelectorAll(".gal img").forEach(img => img.addEventListener("error", () => img.closest("figure").remove()));
    panelInner.querySelectorAll(".fam-row .avatar.has-photo img").forEach(img => img.addEventListener("error", () => { const a = img.closest(".avatar"); if (a) { a.classList.remove("has-photo"); a.textContent = a.dataset.fallback; } }));
    panelInner.querySelectorAll(".p-photo .avatar.has-photo img").forEach(img => img.addEventListener("error", () => { const a = img.closest(".avatar"); if (a) { a.classList.remove("has-photo"); a.textContent = a.dataset.fallback; } }));
  }

  // The panel for a box: all the brothers and sisters of one ancestor, in one place.
  function renderBoxPanel(c) {
    const kids = c.members.map(k => byId[k]);
    const fam = FAMILIES.find(f => (f.clusters || []).includes(c.id));
    const anc = fam ? byId[fam.kids.find(k => LINE.has(k)) || fam.kids[0]] : null;   // the ancestor they grew up with
    const count = kids.reduce((t, k) => t + (k.many || 1), 0);
    const aunts = /aunt/i.test(c.rel), uncles = /uncle/i.test(c.rel);
    const words = aunts && uncles ? (count === 2 ? "brother and sister" : "brothers and sisters") : aunts ? (count === 1 ? "sister" : "sisters") : (count === 1 ? "brother" : "brothers");
    const segs = kids[0].chain ? kids[0].chain.split(" → ") : [];
    const chain = !segs.length ? "" : count === 1 ? kids[0].chain : ["They", "their " + segs[1].replace(/^(his|her|their) /, "")].concat(segs.slice(2)).join(" → ");
    const links = [...new Set(kids.flatMap(k => k.links))];
    panelInner.innerHTML = `
      <div class="p-head"><div>
        <h2>${esc(c.title)}</h2>
        <div class="yrs">${count} ${count === 1 ? "person" : "people"}</div>
      </div></div>
      <div class="relbox side-${kids[0].side}">
        <div class="big">Your <span class="rw">${esc(c.rel.toLowerCase())}</span></div>
        <div class="plain">${esc(c.plain || (anc ? `The ${words} of ${anc.name}.` : ""))}</div>
        ${chain ? `<div class="chain">${esc(chain)}</div>` : ""}
      </div>
      ${anc ? `<section class="fam"><h3>Family</h3>${famParents(anc.id)}<h4>On your line</h4><ul class="fam-list">${famItem(anc.id, sibWord)}</ul></section>` : ""}
      <div class="sibs">${kids.map(k => {
        const src = [...new Set(k.facts.map(f => f[2]).filter(Boolean))];
        return `<section class="sib"><h4>${k.adopted ? ADOPTED : ""}${esc(k.name)}</h4><div class="when">${esc(k.years)}</div>${k.bio.map(t => `<p>${esc(t)}</p>`).join("")}${src.length ? `<small class="src">Source: ${esc(src.join("; "))}${k.facts.some(f => f[3]) ? '<span class="unv">not verified</span>' : ""}</small>` : ""}</section>`;
      }).join("")}</div>
      ${links.length ? `<section><h3>Links</h3><ul class="linklist">${links.map(k => `<li><a href="${esc(SRC[k][1])}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a></li>`).join("")}</ul></section>` : ""}`;
  }

  let current = "tim";
  // Pick a person or a box. A direct ancestor lights the line from that person down to Tim.
  // A box of brothers and sisters, or another relative, only opens the panel. The choice takes a mark while the panel is open.
  function select(id, opts = {}) {
    if (byId[id] && byId[id].mini) id = byId[id].cluster;   // a brother or a sister opens the box of the whole family
    const box = clById[id], p = box ? null : byId[id];
    if (!box && !p) return;
    current = id;
    const direct = !!p && LINE.has(id) && id !== "tim";
    canvas.querySelectorAll(".card").forEach(c => {
      c.classList.toggle("sel", c.dataset.id === id);
      c.classList.toggle("on-path", direct && p.path.includes(c.dataset.id));
    });
    canvas.querySelectorAll(".cluster").forEach(c => { c.classList.remove("on-path"); c.classList.toggle("sel", c.dataset.cluster === id); });
    canvas.classList.toggle("has-sel", direct);
    const at = box || p;
    if (box) renderBoxPanel(box); else     renderPanel(p);
    panel.scrollTop = 0;
    if (opts.open) {
      setPanel(true);
      // keep the chosen card clear of the panel
      const el = canvas.querySelector(`.card[data-id="${id}"], .cluster[data-cluster="${id}"]`);
      if (el && !opts.reveal && getComputedStyle(panel).position === "fixed" && !APP.matches) {
        const free = window.innerWidth - panel.offsetWidth - 16, r = el.getBoundingClientRect();
        if (r.right > free) treeScroll.scrollBy({ left: r.right - free, behavior: "smooth" });
      }
    }
    if (opts.reveal) {
      const left = EDGE + (X(at.col) + CARD_W / 2) * zoom - treeScroll.clientWidth / 2;
      const top = edgeTop() + (Y(at.row) + CARD_H / 2) * zoom - treeScroll.clientHeight / 2;
      treeScroll.scrollTo({ left: Math.max(0, left), top: Math.max(0, top), behavior: "smooth" });
      // The page glides up to the tree with its bar of buttons ("All children", "Direct line only", "Missing ancestors")
      // just under the top of the screen, not the chart alone. Tim asked for this on 2026-10-25.
      const bar = treeScroll.closest(".tree-box").querySelector(".chart-bar").getBoundingClientRect();
      if (!APP.matches && !mapFull && (bar.top < 0 || bar.top > window.innerHeight * 0.6)) {
        const top = Math.max(0, Math.round(bar.top + window.scrollY - 16));
        if (smooth) smooth.scrollTo(top); else window.scrollTo({ top, behavior: "smooth" });
      }
    }
  }

  // A click on a person opens them. When the panel slides over the page, a click anywhere else outside it closes it.
  // (A drag of the chart is not a click: the chart swallows it.)
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-id]");
    if (el) select(el.dataset.id, { open: true, reveal: !el.closest(".canvas") });
    else if (panel.classList.contains("open") && getComputedStyle(panel).position === "fixed" && !panel.contains(e.target)) closePanel();
  });
  // Open or close the panel. When it slides over the chart, the chart gets spare room on the right,
  // so that a card at the far right can still move clear of the panel.
  function setPanel(open) {
    panel.classList.toggle("open", open);
    const over = open && getComputedStyle(panel).position === "fixed" && !APP.matches;
    document.getElementById("sizer").style.marginRight = over ? panel.offsetWidth + "px" : "";
    if (!APP.matches) setZoom(zoom, true);   // when the panel closes, the chart fills the freed width
    // On the phone a card covers the screen. It adds a step to the browser's history, so the phone's own back gesture closes it.
    if (open && APP.matches && !appCard) { history.pushState({ familyCard: true }, ""); appCard = true; }
    paintStatusBar();
  }
  // Closing the panel clears the choice: no line stays lit, and no name stays marked.
  function closePanel() {
    setPanel(false);
    if (appCard) { appCard = false; history.back(); }   // the card's history step goes too
    current = "tim";
    canvas.querySelectorAll(".sel, .on-path").forEach(c => c.classList.remove("sel", "on-path"));
    canvas.classList.remove("has-sel");
    if (getComputedStyle(panel).position !== "fixed") renderPanel(byId.tim);   // a panel that stays on screen goes back to Tim
  }
  document.getElementById("panelClose").addEventListener("click", closePanel);
  window.addEventListener("popstate", () => { if (appCard) { appCard = false; closePanel(); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

  // ---- zoom ----
  const ZMAX = 1, ZSTEP = 1.25;   // Tim's rule: never closer than 100%
  const sizer = document.getElementById("sizer");
  const zoomOutBtn = document.getElementById("zoomOut"), zoomInBtn = document.getElementById("zoomIn");
  const zoomLabel = document.getElementById("zoomLevel");
  // The smallest zoom: the chart just fills the width you can see. An open panel on the right does not count as space.
  // The chart can never be narrower than its box, so no empty space shows beside it.
  function fitZoom() {
    const left = treeScroll.getBoundingClientRect().left + treeScroll.clientLeft, edge = left + treeScroll.clientWidth;
    const over = panel.classList.contains("open") && getComputedStyle(panel).position === "fixed" && !APP.matches;
    const right = over ? Math.min(edge, window.innerWidth - panel.offsetWidth) : edge;
    return Math.min(ZMAX, Math.max(200, right - left - 2 * EDGE) / W);
  }
  function setZoom(z, keepCentre = true) {
    const zmin = fitZoom();
    z = Math.min(ZMAX, Math.max(zmin, z));
    const centre = (treeScroll.scrollLeft + treeScroll.clientWidth / 2 - EDGE) / zoom;
    const centreY = (treeScroll.scrollTop + treeScroll.clientHeight / 2 - edgeTop()) / zoom;
    zoom = z;
    canvas.style.transform = `scale(${z})`;
    sizer.style.width = Math.ceil(W * z) + 2 * EDGE + "px";
    sizer.style.height = Math.ceil(H * z) + EDGE + edgeTop() + "px";
    zoomLabel.textContent = Math.round(z * 100) + "%";
    zoomOutBtn.disabled = z <= zmin + 0.001;   // already fits: the minus button does nothing
    zoomInBtn.disabled = z >= ZMAX - 0.001;
    if (keepCentre) {
      treeScroll.scrollLeft = Math.max(0, EDGE + centre * z - treeScroll.clientWidth / 2);
      treeScroll.scrollTop = Math.max(0, edgeTop() + centreY * z - treeScroll.clientHeight / 2);
    }
  }
  zoomInBtn.addEventListener("click", () => setZoom(zoom * ZSTEP));
  zoomOutBtn.addEventListener("click", () => setZoom(zoom / ZSTEP));
  // Fit: the whole width of the chart fills the space you can see.
  document.getElementById("zoomFit").addEventListener("click", () => {
    setZoom(fitZoom(), false);
    treeScroll.scrollLeft = 0;
  });
  // When the window or the pane changes width, the chart grows to fill its box again.
  let boxWidth = treeScroll.clientWidth;
  const onBoxResize = () => { const w = treeScroll.clientWidth; if (w === boxWidth) return; boxWidth = w; setZoom(zoom, true); };
  window.addEventListener("resize", onBoxResize);
  if (window.ResizeObserver) new ResizeObserver(onBoxResize).observe(treeScroll);

  // ---- the tree box fits the screen ----
  // The box runs from the "All children" bar down to the notes under the chart. The chart takes the height left over,
  // so the whole box shows at once.
  const treeBox = treeScroll.closest(".tree-box");
  const fitBox = () => {
    const rest = treeBox.offsetHeight - treeScroll.offsetHeight;
    treeScroll.style.maxHeight = Math.max(240, window.innerHeight - 32 - rest) + "px";
  };
  window.addEventListener("resize", fitBox);

  // ---- zoom like a map set in a page ----
  // As on an embedded Google map ("cooperative gestures"): a plain scroll moves the page, never the chart.
  // Ctrl or ⌘ with the wheel zooms the chart, and so does a pinch, which arrives as a wheel turn with ctrlKey.
  // A plain scroll over the chart shows a short hint saying so. The point under the pointer stays where it is.
  const MAC = /Mac|iPhone|iPad/.test(navigator.platform);
  const treeHint = document.getElementById("treeHint");
  treeHint.textContent = `Hold ${MAC ? "⌘" : "Ctrl"} and scroll to zoom the tree`;
  document.getElementById("treeHowTo").textContent = `Drag the chart to move it. Hold ${MAC ? "⌘" : "Ctrl"} and scroll, or pinch, to zoom. Pick a card to read about that person.`;
  let hintTimer = 0;
  treeScroll.addEventListener("wheel", e => {
    // Full screen works like Google Maps: there is no page behind, so the wheel zooms, with no key held.
    if (!e.ctrlKey && !e.metaKey && !mapFull) {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        treeHint.classList.add("show");
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => treeHint.classList.remove("show"), 1400);
      }
      return;
    }
    e.preventDefault();
    treeHint.classList.remove("show");
    const box = treeScroll.getBoundingClientRect();
    const ox = e.clientX - box.left - treeScroll.clientLeft, oy = e.clientY - box.top - treeScroll.clientTop;
    const px = (treeScroll.scrollLeft + ox - EDGE) / zoom, py = (treeScroll.scrollTop + oy - edgeTop()) / zoom;
    const turn = Math.max(-40, Math.min(40, e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY));
    setZoom(zoom * Math.exp(-turn * 0.006), false);
    treeScroll.scrollLeft = Math.max(0, EDGE + px * zoom - ox);
    treeScroll.scrollTop = Math.max(0, edgeTop() + py * zoom - oy);
  }, { passive: false });

  // ---- drag the chart, like a map ----
  // A touch screen already moves the chart with a finger, so this is for a mouse or a pen.
  let drag = null, dragged = false;
  const endDrag = () => {
    if (!drag) return;
    dragged = drag.on;
    drag = null;
    treeScroll.classList.remove("dragging");
    setTimeout(() => { dragged = false; }, 0);
  };
  // A double click on the map itself, where the hand shows, toggles full screen, as the button in its corner does
  // (Tim, 2026-10-25). A card or a box keeps its own click. The second press does not select any text.
  const onMapItself = e => !e.target.closest(".card, .cluster, .map-ctl");
  treeScroll.addEventListener("mousedown", e => { if (e.detail > 1 && onMapItself(e)) e.preventDefault(); });
  treeScroll.addEventListener("dblclick", e => {
    if (APP.matches || !onMapItself(e)) return;
    document.getElementById("mapFs").click();
  });
  treeScroll.addEventListener("pointerdown", e => {
    if (e.pointerType === "touch" || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, left: treeScroll.scrollLeft, top: treeScroll.scrollTop, on: false, id: e.pointerId };
  });
  treeScroll.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on) {
      if (Math.hypot(dx, dy) < 8) return;   // a small wobble is still a click
      drag.on = true;
      drag.x = e.clientX; drag.y = e.clientY;   // start the move from here, so the chart does not jump
      treeScroll.classList.add("dragging");
      try { treeScroll.setPointerCapture(drag.id); } catch (err) {}
      return;
    }
    e.preventDefault();
    treeScroll.scrollLeft = drag.left - dx;
    treeScroll.scrollTop = drag.top - dy;
  });
  // listen on the window, so a release outside the chart also ends the drag
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  // the click that ends a drag must not pick a card
  treeScroll.addEventListener("click", e => { if (dragged) { e.stopPropagation(); e.preventDefault(); } }, true);
  treeScroll.addEventListener("dragstart", e => e.preventDefault());

  // ---- ancestors not found: empty boxes on or off ----
  const gapsBtn = document.getElementById("gapsBtn");
  gapsBtn.innerHTML = `<span class="lg">Missing ancestors</span><span class="sh">Missing</span> · ${GAPS.length}`;   // a phone shows the short word
  gapsBtn.setAttribute("aria-pressed", String(wide));
  gapsBtn.addEventListener("click", () => {
    wide = !wide;
    try { localStorage.setItem("familyTreeGaps2", wide ? "1" : "0"); } catch (e) {}
    gapsBtn.setAttribute("aria-pressed", String(wide));
    setLayout(wide);
    drawChart(wide);
    setZoom(zoom, false);
    select(current);
    const me = byId[current] || clById[current];
    treeScroll.scrollLeft = Math.max(0, EDGE + CX(me.col) * zoom - treeScroll.clientWidth / 2);
  });

  // ---- find a person ----
  // Each word typed must start a word of the person's name, short name or maiden name; accents do not count.
  // A pick goes through the page's usual click (it carries data-id), which opens the person and moves the chart to them.
  // A chart zoomed out too far to read comes in to 80% first. Up and down move through the list; Enter takes the first.
  {
    const input = document.getElementById("findInput"), list = document.getElementById("findList");
    const plain = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    const words = p => plain([p.name, p.short, p.nee].join(" ")).split(/[^a-z0-9]+/).filter(Boolean);
    const all = PEOPLE.map(p => ({ p, w: words(p) }));
    const show = () => {
      const q = plain(input.value).split(/[^a-z0-9]+/).filter(Boolean);
      if (!q.length) { list.hidden = true; input.setAttribute("aria-expanded", "false"); return; }
      const hits = all.filter(({ w }) => q.every(t => w.some(x => x.startsWith(t)))).slice(0, APP.matches ? Infinity : 8);   // the phone lists every match
      list.innerHTML = hits.length
        ? hits.map(({ p }) => `<button type="button" class="side-${p.side}" data-id="${p.id}"><b>${esc(p.short || p.name)}</b><small>${esc(p.rel || "")}</small></button>`).join("")
        : '<div class="none">No one by that name</div>';
      list.hidden = false; input.setAttribute("aria-expanded", "true");
      fitList();
    };
    // On the phone the keyboard covers the bottom of the screen. The list ends just above it (or above the tabs) and scrolls,
    // so every match can be reached with the keyboard up. The visible area is the visual viewport.
    const vv = window.visualViewport;
    const fitList = () => {
      if (!APP.matches || list.hidden) { list.style.maxHeight = ""; return; }
      const seen = vv ? vv.offsetTop + vv.height : window.innerHeight;
      const bottom = Math.min(seen, document.getElementById("tabbar").getBoundingClientRect().top);   // above the keyboard, or the tabs once it closes
      list.style.maxHeight = Math.max(120, Math.floor(bottom - list.getBoundingClientRect().top - 12)) + "px";
    };
    if (vv) { vv.addEventListener("resize", fitList); vv.addEventListener("scroll", fitList); }
    input.addEventListener("input", show);
    input.addEventListener("focus", show);
    input.addEventListener("keydown", e => {
      const items = [...list.querySelectorAll("button")];
      if (e.key === "Enter" && items[0]) { e.preventDefault(); items[0].click(); }
      else if (e.key === "ArrowDown" && items[0]) { e.preventDefault(); items[0].focus(); }
      else if (e.key === "Escape") { input.value = ""; show(); }
    });
    list.addEventListener("keydown", e => {
      const items = [...list.querySelectorAll("button")], k = items.indexOf(document.activeElement);
      if (e.key === "ArrowDown" && k < items.length - 1) { e.preventDefault(); items[k + 1].focus(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); (k > 0 ? items[k - 1] : input).focus(); }
      else if (e.key === "Escape") input.focus();
    });
    list.addEventListener("click", e => {
      if (!e.target.closest("[data-id]")) return;
      if (zoom < 0.6) setZoom(0.8, false);   // the document's click handler then opens the person and moves the chart
      list.hidden = true; input.value = ""; input.setAttribute("aria-expanded", "false");
    });
    document.addEventListener("click", e => { if (!e.target.closest(".find")) list.hidden = true; });
  }

  // ---- the section menu ----
  // One entry for each section title on the page, then "Back to top". A choice glides the page there and closes the menu.
  {
    const btn = document.getElementById("menuBtn"), list = document.getElementById("menuList");
    // Where a section starts: a coloured band starts where its colour starts, so the colour meets the top of the screen.
    // A white section starts where the band or block above it ends, so no strip of the colour above shows.
    const startOf = sec => {
      const y = el => el.getBoundingClientRect().top + window.scrollY;
      const prev = sec.previousElementSibling;
      return Math.round(sec.classList.contains("band") || !prev ? y(sec) : prev.getBoundingClientRect().bottom + window.scrollY);
    };
    const go = target => {
      const top = typeof target === "number" ? target : startOf(target);
      if (smooth) smooth.scrollTo(top);
      else window.scrollTo({ top, behavior: "smooth" });
    };
    const sections = [...document.querySelectorAll("section h2.sec-title")].map(h => [h.textContent.trim(), h.closest("section")]);
    list.innerHTML = sections.map(([t], k) => `<button type="button" data-go="${k}">${esc(t)}</button>`).join("") + '<hr><button type="button" data-go="top">Back to top</button>';
    const open = on => { list.hidden = !on; btn.setAttribute("aria-expanded", String(on)); };
    btn.addEventListener("click", e => { e.stopPropagation(); open(list.hidden); });
    list.addEventListener("click", e => {
      const b = e.target.closest("[data-go]");
      if (!b) return;
      e.stopPropagation();
      open(false);
      go(b.dataset.go === "top" ? 0 : sections[+b.dataset.go][1]);
    });
    document.addEventListener("click", e => { if (!list.hidden && !e.target.closest(".menu")) open(false); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !list.hidden) { open(false); btn.focus(); } });
  }

  // ---- the status bar (a phone opened from its home-screen icon) ----
  // The bar is solid, in the theme colour. It takes the colour at the top of the screen, so it runs on into the page:
  // the open card, or the band at the top of the open tab (red on Notable), or else the page.
  // iOS 26 takes that colour from the page's own background, not from the theme colour (seen in the simulator on
  // 2026-10-25), so on the phone the page's background takes it too. Sections without a band keep the page colour.
  function paintStatusBar() {
    let colour = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    if (APP.matches) {
      const top = [...document.querySelectorAll("[data-tab].on")].find(e => getComputedStyle(e).display !== "none");
      const band = top && getComputedStyle(top).backgroundColor;
      if (panel.classList.contains("open")) colour = getComputedStyle(panel).backgroundColor;
      else if (band && band !== "rgba(0, 0, 0, 0)") colour = band;
    }
    document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute("content", colour));
    document.documentElement.style.backgroundColor = document.body.style.backgroundColor = APP.matches ? colour : "";
  }

  // ---- light or dark ----
  // A click sets data-theme on the page and saves the choice. With no choice, the page is dark.
  const themeBtns = document.querySelectorAll(".theme button");
  const deviceDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function showTheme() {
    const set = document.documentElement.getAttribute("data-theme");
    const dark = set ? set === "dark" : !!(deviceDark && deviceDark.matches);
    themeBtns.forEach(b => b.setAttribute("aria-pressed", String((b.dataset.themeSet === "dark") === dark)));
    paintStatusBar();
  }
  themeBtns.forEach(b => b.addEventListener("click", () => {
    document.documentElement.setAttribute("data-theme", b.dataset.themeSet);
    try { localStorage.setItem("familyTreeTheme", b.dataset.themeSet); } catch (e) {}
    showTheme();
  }));
  if (deviceDark && deviceDark.addEventListener) deviceDark.addEventListener("change", showTheme);
  showTheme();

  // ---- direct line or all children ----
  const modeBtns = document.querySelectorAll(".modes button");
  function setMode(mode) {
    canvas.classList.toggle("direct-only", mode === "direct");
    modeBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
    try { localStorage.setItem("familyTreeMode", mode); } catch (e) {}
  }
  modeBtns.forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  let savedMode = null;
  try { savedMode = localStorage.getItem("familyTreeMode"); } catch (e) {}
  setMode(savedMode === "direct" ? "direct" : "all");

  // The chart opens at 100%, at its top left corner, on a computer as on a phone. Tim asked for this on 2026-10-25.
  setZoom(1, false);

  select("tim");
  treeScroll.scrollLeft = 0;
  treeScroll.scrollTop = 0;
  fitBox();

  // ---- a computer: the map full screen ----
  // The button in the map's corner fills the screen with the tree and its panel. The bar of buttons floats over the map.
  // The same button, or Esc, leaves full screen. The page's smooth scroll pauses meanwhile, so a plain scroll moves the map.
  {
    const stage = treeScroll.closest(".stage"), btn = document.getElementById("mapFs");
    const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
    if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) btn.hidden = true;
    btn.addEventListener("click", () => {
      if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
    });

    btn.disabled = true;
    msg.textContent = "Opening. This can take a few seconds.";
    await new Promise(r => setTimeout(r, 40));
    let ok = false, master = null;
    try { master = await makeKey(input.value); ok = open(master); } catch (err) { ok = false; }
    if (ok) { try { localStorage.setItem(STORE, toHex(master)); } catch (err) {} return; }
    msg.textContent = "That password is not right. Try again.";
    btn.disabled = false;
    input.select();
  });
})();
</script>
</body>
</html>
