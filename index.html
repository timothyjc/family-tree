<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Clark and Laught Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
/* Layout: a six-generation chart you can drag, with one reading panel beside it (wide) or sliding in from the right (narrow). */
:root {
  --bg: #F7F9F7;
  --surface: #FFFFFF;
  --surface-2: #E1E8E3;
  --ink: #1B2926;
  --ink-2: #51625C;
  --line: #B5C2BB;
  --mat: #2A6B5E;      /* mother's side: eucalyptus */
  --pat: #86486A;      /* father's side: plum */
  --mat-wash: #C6EFD8;   /* a card on a chosen line, mother's side */
  --mat-wash-2: #98DFBA; /* the chosen card, mother's side */
  --pat-wash: #F5D2E5;   /* a card on a chosen line, father's side */
  --pat-wash-2: #EBAACD; /* the chosen card, father's side */
  --gold: #A9760A;     /* notable people: wattle */
  --star: #F7B500;     /* the star before a notable name: plain, full yellow, in both themes */
  --gold-bg: #F6E8C3;
  --shadow: 0 10px 30px rgba(20, 40, 34, .18);
  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111816; --surface: #19231F; --surface-2: #24312C; --ink: #E5EDE8; --ink-2: #9BAFA7;
    --line: #3B4C46; --mat: #72C4B2; --pat: #D9A0C0;
    --mat-wash: #1D4C3C; --mat-wash-2: #256B52; --pat-wash: #4D2742; --pat-wash-2: #70335B; --gold: #E6B54A; --gold-bg: #3A2F12;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111816; --surface: #19231F; --surface-2: #24312C; --ink: #E5EDE8; --ink-2: #9BAFA7;
  --line: #3B4C46; --mat: #72C4B2; --pat: #D9A0C0;
    --mat-wash: #1D4C3C; --mat-wash-2: #256B52; --pat-wash: #4D2742; --pat-wash-2: #70335B; --gold: #E6B54A; --gold-bg: #3A2F12;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.wrap { max-width: 1700px; margin-inline: auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 36px 120px; display: flex; flex-direction: column; gap: clamp(64px, 8vw, 104px); }

.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(34px, 5vw, 56px); line-height: 1.05; margin: 8px 0 16px; text-wrap: balance; letter-spacing: -.015em; }
h2 { font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; }
.lede { max-width: 84ch; margin: 0; color: var(--ink-2); font-size: 16px; }
/* One section under the next, each with a large title and room around it. */
.sec { border-top: 1px solid var(--line); padding-top: clamp(22px, 3vw, 32px); min-width: 0; }
.sec.read { max-width: 1080px; }
.sec-title { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.1; letter-spacing: -.012em; margin: 0 0 8px; text-wrap: balance; }
.sec-sub { max-width: 76ch; margin: 0 0 clamp(20px, 2.6vw, 30px); font-size: 15px; color: var(--ink-2); }
.sec-note { max-width: 76ch; margin: 14px 0 0; font-size: 12px; color: var(--ink-2); }
.sub-title { font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.2; letter-spacing: 0; text-transform: none; color: var(--ink); margin: 0 0 6px; }
.sub-count { margin-left: 10px; font-family: var(--mono); font-size: 11px; font-weight: 400; letter-spacing: .04em; color: var(--ink-2); }

/* Notable people */
/* Notable people: every card has the same size, in the golden ratio. Beside the portrait sit three lines: the name, the years and the relation. The text sits under them.
   Each size is a share of the card's width (cqw), so a card keeps the same look at any width. The pixel sizes are for a browser without cqw. */
/* The cards fill the row on a wide screen. A card never grows past 250px, so the type stays small. */
.notables { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 10px; }
.notable-chip { container-type: inline-size; aspect-ratio: 1.618 / 1; width: 100%; max-width: 250px; min-width: 0; overflow: hidden; display: block; padding: 0; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; color: inherit; font: inherit; }
.notable-chip:hover { border-color: var(--ink-2); }
.notable-chip .nc { position: relative; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 10px 12px; padding: 4.4cqw 5.2cqw; }
.notable-chip .nc-tag { margin-bottom: 6px; margin-bottom: 2.6cqw; font-family: var(--mono); font-size: 9px; font-size: 3.9cqw; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; line-height: 1.3; color: var(--gold); }
.notable-chip .nc-head { display: flex; align-items: center; gap: 8px; gap: 3.6cqw; }
.notable-chip .avatar { width: 40px; height: 40px; width: 17.5cqw; height: 17.5cqw; font-size: 12px; font-size: 5.3cqw; }
.notable-chip .nc-id { min-width: 0; display: flex; flex-direction: column; }
.notable-chip .nc-name { font-family: var(--display); font-size: 14.5px; font-size: 6.3cqw; font-weight: 600; line-height: 1.15; letter-spacing: -.005em; }
.notable-chip .nc-yrs { margin-top: 1px; margin-top: .6cqw; font-family: var(--mono); font-size: 10px; font-size: 4.4cqw; line-height: 1.3; color: var(--ink-2); }
.notable-chip .nc-rel { margin-top: 1px; margin-top: .6cqw; font-size: 10px; font-size: 4.4cqw; font-weight: 600; line-height: 1.2; color: var(--tint, var(--ink-2)); }
.notable-chip .nc-what { margin-top: 8px; margin-top: 3.6cqw; font-size: 12.5px; font-size: 5.45cqw; line-height: 1.4; color: var(--ink); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }

/* Stage */
.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
.tree-box { min-width: 0; position: relative; }
/* the buttons on the left of the bar: who to show, and the missing ancestors */
.bar-left { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chart-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
.modes, .theme { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.modes button, .theme button { background: none; border: 0; border-left: 1px solid var(--line); height: 36px; padding: 0 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.modes button:first-child, .theme button:first-child { border-left: 0; }
.modes button[aria-pressed="true"], .theme button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.page-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 24px; }
.page-top > div:first-child { flex: 1 1 320px; min-width: 0; }
.theme { flex: none; }
.theme button { display: inline-flex; align-items: center; gap: 6px; height: 34px; }
.theme svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cluster { position: absolute; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 7px 6px; border: 1px dashed var(--ink-2); border-radius: 6px; transition: opacity .2s; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.cluster:hover { border-color: var(--ink); }
.cluster .ttl { margin: 0 0 4px; font-family: var(--mono); font-weight: 500; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); line-height: 1.3; }
/* One name on each line. A list of more than six names runs down two columns. */
.cluster .names { display: grid; grid-auto-flow: column; grid-auto-columns: auto; gap: 2px 7px; align-self: stretch; justify-content: start; justify-items: start; }
.cluster .names span { padding: 1px 0; font-family: var(--display); font-size: 11.5px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
.cluster .many { margin-top: 3px; padding: 1px 0; font-size: 11.5px; font-style: italic; line-height: 1.2; color: var(--ink-2); white-space: nowrap; }
.cluster .rel { margin-top: auto; padding-top: 6px; font-size: 11.5px; font-weight: 600; line-height: 1.25; }
/* The whole box is one link. The chosen box takes a black mark. */
.cluster.sel { border-style: solid; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.cluster.sel .ttl { background: var(--ink); color: var(--bg); border-radius: 3px; padding: 2px 5px; margin-left: -1px; }
.canvas.has-sel .cluster:not(.on-path) { opacity: .75; }
.canvas.has-sel .cluster.on-path { background: var(--surface); border-color: var(--ink); }
.canvas.direct-only .cluster, .canvas.direct-only .links .extra, .canvas.direct-only .card.aside, .canvas.direct-only .kids-pill.side { display: none; }
.links path.extra { stroke-dasharray: 4 3; }
/* an empty box for an ancestor who is not found */
.card.gapbox { border-style: dashed; border-color: var(--ink-2); background: transparent; cursor: default; }
.card.gapbox:hover { border-color: var(--ink-2); }
.card.gapbox .nm { font-style: italic; font-weight: 400; color: var(--ink-2); }
.card.gapbox .avatar { border-style: dashed; }
.links path.gapline { stroke-dasharray: 2 5; }
.gaps-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; height: 38px; padding: 0 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.gaps-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.kids-pill { position: absolute; transform: translateX(-50%); white-space: nowrap; font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; line-height: 14px; padding: 1px 7px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.kids { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; }
.kids li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.kids button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-family: var(--display); font-size: 15px; font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.kids span { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
.gal { display: flex; flex-direction: column; gap: 14px; }
.gal figure { margin: 0; max-width: 560px; }
.gal img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; filter: grayscale(1); }
.gal figcaption { font-size: 13px; margin-top: 5px; }
.gal figcaption small { display: block; font-size: 11px; color: var(--ink-2); }
.kids-note { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); max-width: 62ch; }
.zoom { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; box-shadow: 0 2px 8px rgba(20, 40, 34, .12); }
.zoom button { background: none; border: 0; border-left: 1px solid var(--line); min-width: 38px; height: 36px; padding: 0 10px; cursor: pointer; font-family: var(--mono); font-size: 16px; line-height: 1; color: var(--ink); }
.zoom button:first-child { border-left: 0; }
.zoom button:hover:not(:disabled) { background: var(--surface-2); }
.zoom button:disabled { color: var(--line); cursor: default; }
.zoom .zoom-fit { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.zoom output { display: grid; place-items: center; min-width: 50px; border-left: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sizer { position: relative; overflow: hidden; }
/* The chart moves by a drag and zooms by the wheel, so it shows no scroll bars. */
.tree-scroll::-webkit-scrollbar { display: none; }
.tree-scroll { overflow: auto; scrollbar-width: none; overscroll-behavior: contain; max-height: 80vh; cursor: grab; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; }
.tree-scroll.dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
.tree-scroll.dragging .card, .tree-scroll.dragging .cluster { cursor: grabbing; }
.canvas { position: relative; transform-origin: 0 0; }
.links { position: absolute; inset: 0; pointer-events: none; }
.links path { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }
.hint { max-width: 110ch; font-size: 12px; color: var(--ink-2); margin: 10px 0 0; }

.region { position: absolute; font-size: 12px; line-height: 1.35; color: var(--ink-2); padding-bottom: 7px; border-bottom: 2px solid var(--line); }
.region.m { border-color: var(--mat); }
.region.p { border-color: var(--pat); }
.region b { display: inline; font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.region.m b { color: var(--mat); }
.region.p b { color: var(--pat); }

.card { position: absolute; display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; transition: opacity .2s, border-color .2s, background-color .2s, box-shadow .2s; }
.card:hover { border-color: var(--ink-2); }
.card.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
/* --tint is the family colour of a card: eucalyptus for the mother's side, plum for the father's side. */
.side-m { --tint: var(--mat); --wash: var(--mat-wash); --wash-2: var(--mat-wash-2); }
.side-p { --tint: var(--pat); --wash: var(--pat-wash); --wash-2: var(--pat-wash-2); }
.side-b { --tint: var(--gold); --wash: var(--gold-bg); --wash-2: var(--gold-bg); }
.card.unknown { border-style: dashed; }
/* a relative who is not Tim's direct ancestor: a dashed card, like the dashed boxes */
.card.aside { border-style: dashed; border-color: var(--ink-2); background: transparent; }
/* A chosen line: its cards take a soft wash of the family colour. The other cards stay easy to read. */
.canvas.has-sel .card:not(.on-path) { opacity: .75; }
.canvas.has-sel .card.on-path:not(.you) { background: var(--wash); border-color: var(--tint); }
.canvas .card.sel:not(.you) { background: var(--wash-2); border-color: var(--tint); box-shadow: 0 0 0 2px var(--tint), 0 8px 20px rgba(20, 40, 34, .22); }
.canvas .card.sel:not(.you) .rel { color: var(--ink); }
.canvas.has-sel .card.on-path:not(.you) .yrs, .canvas.has-sel .card.on-path:not(.you) .nee i, .canvas.has-sel .card.on-path:not(.you) .plc { color: var(--ink); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
.avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; font-family: var(--mono); font-size: 11px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); border: 1.5px solid var(--ink-2); }
.avatar .ph-one { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
.avatar.has-photo { position: relative; display: block; }
.ph-tile { position: absolute; max-width: none; filter: grayscale(1) contrast(1.05); }
.side-m .avatar { border-color: var(--mat); color: var(--mat); }
.side-p .avatar { border-color: var(--pat); color: var(--pat); }
.star { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); background: var(--gold-bg); border-radius: 3px; padding: 2px 5px; }
/* A star before a name marks a notable person, on a chart card and on a card in the "Notable" row. */
.st { color: var(--star); }   /* part of the name: the same size, on the same line */
.star.maybe { color: var(--ink-2); background: var(--surface-2); border: 1px dashed var(--ink-2); }
/* Card text, by weight: 1 the name. 2 the surname at birth, in the same typeface and the family colour.
   3 the relation to Tim, at the foot. The years and the place are small and plain, and every place line looks the same. */
.card .nm { font-family: var(--display); font-weight: 600; font-size: 16px; line-height: 1.15; letter-spacing: -.005em; }
.card .nee { font-family: var(--display); font-weight: 600; font-size: 14px; line-height: 1.15; color: var(--tint, var(--ink-2)); }
.card .nee i { font-family: var(--body); font-style: italic; font-weight: 400; font-size: 11px; color: var(--ink-2); margin-right: 4px; }
.card .yrs { font-family: var(--mono); font-size: 11px; line-height: 1.3; color: var(--ink-2); font-variant-numeric: tabular-nums; margin-top: 4px; }
.card .plc { font-size: 11px; line-height: 1.3; color: var(--ink-2); }
.card .rel { margin-top: auto; padding-top: 4px; font-size: 11.5px; font-weight: 600; line-height: 1.25; }
.side-m .rel { color: var(--mat); }
.side-p .rel { color: var(--pat); }
/* Tim's own card: the same card as the others, with a gold outline. */
.card.you { border-color: var(--star); box-shadow: 0 0 0 2px var(--star); }
.card.you .avatar { border-color: var(--star); color: var(--gold); }
.card.you .rel { color: var(--gold); }

/* Reading panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.panel-inner { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.panel-close { display: none; }
.p-head { display: flex; gap: 14px; align-items: flex-start; }
.p-photo { flex: none; width: 84px; }
.p-frame { position: relative; width: 84px; height: 112px; overflow: hidden; border-radius: 4px; border: 1px solid var(--line); }
.p-frame .ph-one { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; }
.p-photo small { display: block; font-size: 10px; color: var(--ink-2); margin-top: 3px; line-height: 1.3; }
.p-head .nee { font-style: italic; color: var(--ink-2); font-size: 13.5px; }
.p-head .yrs { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.p-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.badge { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; color: var(--ink-2); }
.badge.gold { color: var(--gold); background: var(--gold-bg); border-color: transparent; }
.relbox { background: var(--surface-2); border-radius: 4px; padding: 12px 14px; }
.relbox .big { font-family: var(--display); font-size: 19px; font-weight: 600; line-height: 1.2; }
.relbox .plain { font-size: 13.5px; margin-top: 2px; }
.relbox .chain { font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.bio p { margin: 0 0 9px; max-width: 62ch; }
.bio p:last-child { margin-bottom: 0; }
/* the panel for a box: each brother and sister in turn */
.sibs { display: flex; flex-direction: column; gap: 14px; }
.sib { border-top: 1px solid var(--line); padding-top: 12px; }
.sib h4 { margin: 0; font-family: var(--display); font-size: 16.5px; font-weight: 600; line-height: 1.2; }
.sib .when { margin: 2px 0 6px; font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
.sib p { margin: 0 0 6px; max-width: 62ch; }
.sib .src { display: block; font-size: 11.5px; color: var(--ink-2); }
.facts { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 14px; row-gap: 7px; font-size: 13.5px; }
.facts dt { color: var(--ink-2); font-size: 12.5px; padding-top: 1px; }
.facts dd { margin: 0; min-width: 0; }
.facts small { display: block; color: var(--ink-2); font-size: 11.5px; }
.unv { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; border: 1px dashed var(--ink-2); border-radius: 3px; padding: 0 4px; margin-left: 4px; color: var(--ink-2); white-space: nowrap; }
.linklist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.linklist a::after { content: " ↗"; color: var(--ink-2); }

/* Sections under the tree */
/* Everyone, by generation: each generation has its own heading, and its people fill as many columns as fit. */
.gen-group { margin-bottom: 40px; }
.gen-group:last-child { margin-bottom: 0; }
.gen-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); column-gap: 44px; }
.gen-rows + .gen-rows { margin-top: 16px; }   /* the father's side sits under the mother's side */
.gen-row { display: flex; flex-direction: column; gap: 2px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 0; cursor: pointer; width: 100%; }
.gen-row:hover .gn { text-decoration: underline; text-underline-offset: 3px; }
.gen-row .gn { font-family: var(--display); font-size: 17px; font-weight: 600; line-height: 1.2; }
.gen-row .gn i { font-family: var(--body); font-weight: 400; font-size: 12px; color: var(--ink-2); }
.gen-row .gr { font-size: 12.5px; color: var(--ink-2); }
/* the relation takes the colour of its side: green for the mother's side, plum for the father's */
.gen-row .side-m .gk { color: var(--mat); }
.gen-row .side-p .gk { color: var(--pat); }
.places { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 20px; max-width: 76ch; }
.places li { border-left: 0; }
.places b { display: block; font-family: var(--display); font-size: 17px; }
.places span { font-size: 14px; color: var(--ink-2); }
/* the eight great-grandparents: eight small cards */
.places.roots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 232px), 1fr)); gap: 14px; max-width: none; }
.places.roots li { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
#ages { max-width: 820px; overflow-x: auto; }
.root-btn { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.root-btn:hover { text-decoration-color: currentColor; }
.q-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 24px 36px; align-items: start; }
.q-group h4 { margin: 0 0 8px; font-family: var(--display); font-size: 17px; font-weight: 600; }
.q-group ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.q-group label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px; align-items: start; font-size: 14px; line-height: 1.4; cursor: pointer; }
.q-group input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--mat); }
.q-group input:checked + span { color: var(--ink-2); text-decoration: line-through; }
.q-group .todo { gap: 7px; }
.ages { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ages th, .ages td { text-align: left; padding: 7px 12px 7px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
.ages thead th { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.ages tbody th { font-family: var(--display); font-size: 15.5px; font-weight: 600; }
.ages td { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.ages td.avg { font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.ages .up { margin-left: 7px; font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--mat); }
.ages .up.down { color: var(--ink-2); }
.todo { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 5px; }
footer { font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 14px; }

@media (min-width: 1700px) {
  .stage { grid-template-columns: minmax(0, 1fr) 370px; }
  .panel { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
}
@media (max-width: 1699.98px) {
  /* the reading panel slides in from the right */
  .panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 10; width: min(400px, 92vw); overflow: auto; border-radius: 12px 0 0 12px; border-width: 0 0 0 1px; box-shadow: var(--shadow); transform: translateX(105%); visibility: hidden; transition: transform .25s ease, visibility .25s; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .panel.open { transform: none; visibility: visible; }
  .panel-close { display: block; position: sticky; top: 0; margin-left: auto; z-index: 1; background: var(--surface); border: 0; border-bottom-left-radius: 6px; padding: 10px 16px; cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); float: right; }
}
@media (prefers-reduced-motion: reduce) { .panel, .card { transition: none; } }
</style>
<script>
// Light or dark: use the choice saved on this device. With no saved choice, the page follows the device.
try { var savedTheme = localStorage.getItem("familyTreeTheme"); if (savedTheme === "dark" || savedTheme === "light") document.documentElement.setAttribute("data-theme", savedTheme); } catch (e) {}
</script>
<style>
.lock { min-height: 70vh; display: grid; place-items: center; padding: 24px 16px; }
.lock form { width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 28px 24px; box-shadow: var(--shadow); }
.lock h1 { font-family: var(--display); font-size: 28px; line-height: 1.1; margin: 0; text-wrap: balance; }
.lock p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.lock .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.lock label { font-size: 13px; font-weight: 600; margin-top: 6px; }
.lock input { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.lock button { font: inherit; font-weight: 600; padding: 10px 14px; border: 0; border-radius: 6px; background: var(--ink); color: var(--bg); cursor: pointer; }
.lock button:disabled { opacity: .6; cursor: default; }
.lock .lock-msg { min-height: 1.4em; color: var(--pat); font-weight: 600; }
</style>
</head>
<body>

<div class="lock" id="lock" hidden>
  <form id="lockForm" autocomplete="off">
    <p class="eyebrow">Family tree · private</p>
    <h1>The Clark and Laught families</h1>
    <p>This page is for the family. Enter the family password to open it.</p>
    <label for="lockPw">Password</label>
    <input id="lockPw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="submit" id="lockBtn">Open the family tree</button>
    <p class="lock-msg" id="lockMsg" role="alert"></p>
    <p>Capital letters and spaces do not matter. This device remembers the password after the first time.</p>
  </form>
</div>
<noscript><p style="padding:24px">This page needs JavaScript to open.</p></noscript>
<div id="app" hidden></div>

<script>
// The page code. It starts only after the right password unlocks the content.
function startApp(D) {
  const { SRC, PEOPLE, FAMILIES, CLUSTERS, LIFE, PLACES, MOVES, ROOTS, NOTABLE_ORDER, PHOTOS, QUESTIONS, HOLES, GAPS, GAP_LINKS, WIDE, USUAL_AGE } = D;
  const LINE = new Set(D.LINE);

  const GEN_NAMES = ["Your great-great-great-grandparents' generation", "Your great-great-grandparents' generation", "Your great-grandparents' generation", "Your grandparents' generation", "Your parents' generation", "Your generation"];

  const PAD = 16, CARD_W = 136, CARD_H = 208, GAP_X = 14, ROW_GAP = 80;
  // Under a couple: a short line, the label that counts the children, a short line, and then the line that splits to the children.
  const PILL_AT = 13, BUS_AT = 48;
  const PITCH_X = CARD_W + GAP_X, PITCH_Y = CARD_H + ROW_GAP;
  const TOP = 38;   // room above the first row for the two labels: mother's side and father's side
  let W = 0;   // set by setLayout
  const H = PAD * 2 + TOP + 6 * PITCH_Y - ROW_GAP;
  const X = c => PAD + (c - 1) * PITCH_X, CX = c => X(c) + CARD_W / 2, Y = r => PAD + TOP + r * PITCH_Y;

  const byId = Object.fromEntries(PEOPLE.map(p => [p.id, p]));
  const clById = Object.fromEntries(CLUSTERS.map(c => [c.id, c]));
  for (const g of GAPS) byId[g.id] = g;
  for (const q of PEOPLE) if (!q.mini) q.col0 = q.col;
  for (const c of CLUSTERS) c.col0 = c.col;
  // Two layouts. Compact: the columns in PEOPLE and CLUSTERS. Wide: the columns in WIDE, with room for the empty boxes.
  function setLayout(wide) {
    const at = (o) => wide && WIDE[o.id] != null ? WIDE[o.id] : o.col0;
    for (const q of PEOPLE) if (!q.mini) q.col = at(q);
    for (const c of CLUSTERS) { c.col = at(c); for (const k of c.members) { byId[k].row = c.row; byId[k].col = c.col; } }
    for (const g of GAPS) g.col = WIDE[g.id];
    W = PAD * 2 + Math.max(...PEOPLE.map(q => q.col), ...(wide ? GAPS.map(g => g.col) : [])) * PITCH_X - GAP_X;
  }

  const place = p => { const q = PLACES[p.id]; return q ? (q.to ? q.from + " → " + q.to : q.from) : p.country; };
  // The years on a card: "1817–1894 (77)". The number in brackets is the age at death, worked out from the two years.
  // "c." means about. A lone "?" means the year is not found. A year from a family tree shows no mark here; the panel marks it "not verified".
  const life = p => {
    if (p.id === "tim") return "this is you";
    const L = LIFE[p.id];
    if (!L || p.many) return p.years;
    const tidy = t => String(t || "").replace(/\?$/, ""), b = tidy(L[0]), d = tidy(L[1]);
    if (d === "living") return b ? "born " + b : "living";
    if (!b && !d) return "dates not found";
    const one = t => /^(c\.)?\d{4}$/.test(t), y = t => +t.match(/\d{4}/)[0];
    return (b || "?") + "–" + (d || "?") + (one(b) && one(d) ? " (" + (y(d) - y(b)) + ")" : "");
  };
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const initials = p => p.unknown ? "?" : (w => w.length > 1 ? w[0][0] + w[w.length - 1][0] : w[0][0])(p.short.split(" ").filter(x => /^[A-Z]/.test(x)));

  let zoom = 1;
  const canvas = document.getElementById("canvas");
  const treeScroll = document.getElementById("treeScroll");
  const panel = document.getElementById("panel");
  const panelInner = document.getElementById("panelInner");

  // A photo is one image (photo.src) or a crop from the 256-pixel tiles of a Trove newspaper page (photo.tiles).
  // crop = { x, y, w }: the top-left corner and the width of the crop, in pixels of the joined tiles.
  function photoHtml(p, boxW, crop) {
    const ph = p.photo;
    const one = ph.img ? PHOTOS[ph.img] : ph.src;
    // pos, when given, says which part of the picture sits in the middle of the round frame
    if (one) return `<img class="ph-one" src="${esc(one)}" alt="" loading="lazy"${ph.pos ? ` style="object-position:${esc(ph.pos)}"` : ""}>`;
    const t = ph.tiles, k = boxW / crop.w;
    let out = "";
    for (let j = 0; j < t.rows; j++) for (let i = 0; i < t.cols; i++) {
      out += `<img class="ph-tile" alt="" loading="lazy" src="https://trove.nla.gov.au/imageservice/nla.news-page${t.page}/tile3-${t.c0 + i}-${t.r0 + j}" style="left:${((i * 256 - crop.x) * k).toFixed(1)}px;top:${((j * 256 - crop.y) * k).toFixed(1)}px;width:${(256 * k).toFixed(1)}px;height:${(256 * k).toFixed(1)}px">`;
    }
    return out;
  }

  // The star that marks a notable person. It sits before the name. Tim chose the four-point star on 2026-10-10.
  const STAR = '<span class="st" aria-label="Notable">✦</span> ';

  // ---- chart ----
  // Solid lines join Tim's direct ancestors. Dashed lines lead to everyone else, and to the empty boxes.
  const onLine = id => LINE.has(id);
  function drawChart(wide) {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    let d = "", dx = "", dg = "", pills = "";
    const links = wide ? GAP_LINKS : [];
    const fams = FAMILIES.filter(f => !(!f.b && links.some(l => l[0] === f.a))).map(f => ({ f, gap: false }))
      .concat(links.map(l => ({ f: { a: l[0], b: l[1], kids: [l[2]] }, gap: true })));
    for (const { f, gap } of fams) {
      const a = byId[f.a], b = f.b ? byId[f.b] : null;   // b is missing when only one parent is known
      const yMid = b ? Y(a.row) + CARD_H / 2 : Y(a.row) + CARD_H;
      const x1 = X(a.col) + CARD_W, x2 = b ? X(b.col) : x1, mx = b ? (x1 + x2) / 2 : CX(a.col);
      const busY = Y(a.row) + CARD_H + BUS_AT;
      if (gap) {   // a couple with an empty box. A known parent keeps a solid line to the child.
        const k = byId[f.kids[0]], kx = CX(k.col), down = `M${mx} ${yMid}V${busY}H${kx}V${Y(k.row)}`;
        if (a.who) dg += `M${x1} ${yMid}H${x2}` + down;
        else { d += `M${x1} ${yMid}H${mx}` + down; dg += `M${mx} ${yMid}H${x2}`; }
        continue;
      }
      const couple = onLine(f.a) && (!b || onLine(f.b));
      const main = couple ? f.kids.filter(onLine) : [], side = f.kids.filter(k => !main.includes(k));
      const pair = b ? `M${x1} ${yMid}H${x2}` : "", drop = `M${mx} ${yMid}V${busY}`;
      if (couple) d += pair; else dx += pair;
      if (main.length) d += drop; else dx += drop;
      const xs = main.map(k => CX(byId[k].col)).concat(mx);
      const lo = Math.min(...xs), hi = Math.max(...xs);
      d += `M${lo} ${busY}H${hi}`;
      for (const k of main) d += `M${CX(byId[k].col)} ${busY}V${Y(byId[k].row)}`;
      const reach = cx => cx < lo ? `H${lo}` : cx > hi ? `H${hi}` : "";
      for (const k of side) { const cx = CX(byId[k].col); dx += `M${cx} ${Y(byId[k].row)}V${busY}${reach(cx)}`; }
      for (const cid of f.clusters || []) { const c = clById[cid], cx = CX(c.col); dx += `M${cx} ${Y(c.row)}V${busY}${reach(cx)}`; }
      pills += `<span class="kids-pill${main.length ? "" : " side"}" style="left:${mx}px;top:${Y(a.row) + CARD_H + PILL_AT}px">${esc(f.count)}</span>`;
    }
    for (const c of CLUSTERS) if (c.anchor) {
      const ax = CX(byId[c.anchor].col), cx = CX(c.col), y = Y(c.row) - 14;
      dx += `M${cx} ${Y(c.row)}V${y}H${ax}V${Y(c.row)}`;
    }
    let html = `<svg class="links" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}"/><path class="extra" d="${dx}"/><path class="gapline" d="${dg}"/></svg>` + pills;
    // The two labels sit above the chart. Each one spans the columns of its side.
    const upper = PEOPLE.filter(q => q.row <= 3).concat(wide ? GAPS : []);
    const mEnd = Math.max(...upper.filter(q => q.side === "m").map(q => q.col));
    const pStart = Math.min(...upper.filter(q => q.side === "p").map(q => q.col)), pEnd = Math.max(...upper.filter(q => q.side === "p").map(q => q.col));
    html += `<div class="region m" style="left:${X(1)}px;top:${PAD}px;width:${X(mEnd) + CARD_W - X(1)}px"><b>Mother's side</b></div>`;
    html += `<div class="region p" style="left:${X(pStart)}px;top:${PAD}px;width:${X(pEnd) + CARD_W - X(pStart)}px"><b>Father's side</b></div>`;
    for (const p of PEOPLE.filter(q => !q.mini)) {
      const cls = ["card", "side-" + p.side, p.id === "tim" ? "you" : "", p.unknown ? "unknown" : "", LINE.has(p.id) ? "" : "aside"].join(" ").replace(/\s+/g, " ").trim();
      const av = p.photo
        ? `<span class="avatar has-photo" data-fallback="${esc(initials(p))}">${photoHtml(p, 31, p.photo.avatar ? { x: p.photo.avatar.x, y: p.photo.avatar.y, w: p.photo.avatar.d } : null)}</span>`
        : `<span class="avatar">${esc(initials(p))}</span>`;
      html += `<button type="button" class="${cls}" data-id="${p.id}" style="left:${X(p.col)}px;top:${Y(p.row)}px;width:${CARD_W}px;height:${CARD_H}px">
        <span class="card-top">${av}${p.likely ? '<span class="star maybe">Likely</span>' : ""}</span>
        <span class="nm">${p.notable ? STAR : ""}${esc(p.short)}</span>
        ${p.nee ? `<span class="nee"><i>née</i>${esc(p.nee)}</span>` : ""}
        <span class="yrs">${esc(life(p))}</span>
        <span class="plc">${esc(place(p))}</span>
        <span class="rel">${esc(p.rel)}</span>
      </button>`;
    }
    // An empty box for each ancestor who is not found. Like every card, it shows what the person is to Tim.
    const GRAND = ["Great-great-great-grand", "Great-great-grand", "Great-grand", "Grand"];
    if (wide) for (const g of GAPS) {
      html += `<div class="card gapbox side-${g.side}" title="${esc(g.who)} of ${esc(g.of)}" style="left:${X(g.col)}px;top:${Y(g.row)}px;width:${CARD_W}px;height:${CARD_H}px">
        <span class="card-top"><span class="avatar">?</span></span>
        <span class="nm">Not found</span>
        <span class="rel">${GRAND[g.row]}${/father/i.test(g.who) ? "father" : "mother"}</span>
      </div>`;
    }
    for (const c of CLUSTERS) {
      const solo = c.members.filter(k => !byId[k].many), young = c.members.filter(k => byId[k].many);
      html += `<button type="button" class="cluster side-${byId[c.members[0]].side}" data-cluster="${c.id}" data-id="${c.id}" style="left:${X(c.col)}px;top:${Y(c.row)}px;width:${CARD_W}px;min-height:${CARD_H}px">
        <span class="ttl">${esc(c.title)}</span>
        <span class="names" style="grid-template-rows:repeat(${solo.length > 6 ? Math.ceil(solo.length / 2) : Math.max(solo.length, 1)},auto)">${solo.map(k => `<span>${esc(byId[k].short)}</span>`).join("")}</span>
        ${young.map(k => `<span class="many">${esc(byId[k].short)}</span>`).join("")}
        <span class="rel">${esc(c.rel || "")}</span>
      </button>`;
    }
    canvas.innerHTML = html;
    canvas.querySelectorAll(".avatar.has-photo img").forEach(img => {
      img.addEventListener("error", () => { const a = img.closest(".avatar"); if (a) { a.classList.remove("has-photo"); a.textContent = a.dataset.fallback; } });
    });
  }
  // "Missing ancestors" on: the wide layout with empty boxes. Off: the compact layout. It starts off. The choice is saved on the device.
  // The saved name ends in 2, so a choice saved before the change of default on 2026-10-10 is not used.
  let wide = false;
  try { wide = localStorage.getItem("familyTreeGaps2") === "1"; } catch (e) {}
  setLayout(wide);
  drawChart(wide);

  // ---- notable ----
  // Ten people who did something notable, then two records that the page works out from the years:
  // the direct ancestor who lived the longest, and the one who was born the earliest. Both change when a date changes.
  const yr = t => { const m = String(t || "").match(/\d{4}/); return m ? +m[0] : null; };
  const noteCard = (p, text, tag) => {
    const av = p.photo && (p.photo.img || p.photo.src)
      ? `<span class="avatar has-photo" data-fallback="${esc(initials(p))}">${photoHtml(p, 40, null)}</span>`
      : `<span class="avatar">${esc(initials(p))}</span>`;
    return `<button type="button" class="notable-chip side-${p.side}" data-id="${p.id}"><span class="nc">
      ${tag ? `<span class="nc-tag">${esc(tag)}</span>` : ""}
      <span class="nc-head">${av}<span class="nc-id"><span class="nc-name">${p.notable ? STAR : ""}${esc(p.short)}</span><span class="nc-yrs">${esc(life(p))}</span><span class="nc-rel">${esc(p.rel)}</span></span></span>
      <span class="nc-what">${esc(text)}</span>
    </span></button>`;
  };
  const dated = PEOPLE.filter(q => !q.mini && LINE.has(q.id) && q.id !== "tim" && LIFE[q.id]).map(q => ({ q, b: yr(LIFE[q.id][0]), d: yr(LIFE[q.id][1]) }));
  const oldest = dated.filter(x => x.b && x.d).sort((x, y) => (y.d - y.b) - (x.d - x.b))[0];
  const first = dated.filter(x => x.b).sort((x, y) => x.b - y.b)[0];
  const rough = t => /c\.|\?/.test(t) ? "about " : "";
  document.getElementById("notables").innerHTML = PEOPLE.filter(p => p.notable)
    .sort((a, b) => NOTABLE_ORDER.indexOf(a.id) - NOTABLE_ORDER.indexOf(b.id))
    .map(p => noteCard(p, p.deed || p.notable)).join("")
    + (oldest ? noteCard(oldest.q, `About ${oldest.d - oldest.b} years. No direct ancestor on the chart lived longer.`, "Lived the longest") : "")
    + (first ? noteCard(first.q, `Born ${rough(LIFE[first.q.id][0])}in ${first.b}, before any other direct ancestor on the chart.`, "Born the earliest") : "");
  document.querySelectorAll("#notables .avatar.has-photo img").forEach(img => {
    img.addEventListener("error", () => { const a = img.closest(".avatar"); if (a) { a.classList.remove("has-photo"); a.textContent = a.dataset.fallback; } });
  });

  // ---- ancestors by generation ----
  // Direct ancestors only, from Tim's parents back. No brothers, sisters, aunts or uncles. Each heading counts how many are found.
  // The order copies the chart: the mother's side first, then the father's side under it, each from left to right.
  const ANC_NAMES = ["Your great-great-great-grandparents", "Your great-great-grandparents", "Your great-grandparents", "Your grandparents", "Your parents"];
  let list = "";
  for (let r = 4; r >= 0; r--) {
    const found = PEOPLE.filter(q => q.row === r && !q.mini && LINE.has(q.id)).sort((x, y) => WIDE[x.id] - WIDE[y.id]), all = 2 ** (5 - r);
    list += `<div class="gen-group"><h3 class="sub-title">${esc(ANC_NAMES[r])}<span class="sub-count">${found.length} of ${all}</span></h3>`;
    for (const side of ["m", "p"]) {
      list += `<div class="gen-rows">` + found.filter(p => p.side === side).map(p =>
        `<button type="button" class="gen-row" data-id="${p.id}"><span class="gn">${p.notable ? STAR : ""}${esc(p.short)}${p.nee ? ` <i>née ${esc(p.nee)}</i>` : ""}</span><span class="gr"><span class="side-${p.side}"><span class="gk">${esc(p.rel)}</span></span> · ${esc(place(p))}</span></button>`).join("") + `</div>`;
    }
    list += "</div>";
  }
  document.getElementById("genList").innerHTML = list;

  // ---- how long each generation lived ----
  // Worked out from LIFE for the direct ancestors, so the table stays current when a date changes.
  const yearOf = t => { const m = String(t || "").match(/\d{4}/); return m ? +m[0] : null; };
  const AGE_ROWS = [[3, "Grandparents", 4], [2, "Great-grandparents", 8], [1, "Great-great-grandparents", 16], [0, "Great-great-great-grandparents", 32]];
  // The usual age: what a person of 25 could expect to reach, in the year when the ancestor was 25.
  const usualAt = (rows, y) => {
    if (y <= rows[0][0]) return rows[0][1];
    for (let i = 1; i < rows.length; i++) if (y <= rows[i][0]) { const [y0, v0] = rows[i - 1], [y1, v1] = rows[i]; return v0 + (v1 - v0) * (y - y0) / (y1 - y0); }
    return rows[rows.length - 1][1];
  };
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  document.getElementById("ages").innerHTML = `<table class="ages"><thead><tr><th>Generation</th><th>Average age</th><th>Usual then</th><th>Youngest to oldest</th><th>Known ages</th></tr></thead><tbody>` +
    AGE_ROWS.map(([r, label, total]) => {
      const known = PEOPLE.filter(q => !q.mini && q.row === r && LINE.has(q.id) && LIFE[q.id])
        .map(q => { const b = yearOf(LIFE[q.id][0]), d = yearOf(LIFE[q.id][1]); if (!b || !d) return null;
          const y = b + 25, aus = /Australia/.test(q.country) && y >= 1921;
          return { age: d - b, usual: usualAt(aus ? USUAL_AGE.australia : USUAL_AGE.england, y) }; }).filter(Boolean);
      if (!known.length) return "";
      const ages = known.map(k => k.age), avg = mean(ages), usual = mean(known.map(k => k.usual)), diff = Math.round(avg - usual);
      const tag = diff > 0 ? `<span class="up">+${diff}</span>` : diff < 0 ? `<span class="up down">−${-diff}</span>` : "";
      return `<tr><th>${label}</th><td class="avg">${Math.round(avg)}${tag}</td><td>${Math.round(usual)}</td><td>${Math.min(...ages)} to ${Math.max(...ages)}</td><td>${ages.length} of ${total}</td></tr>`;
    }).join("") + "</tbody></table>";

  // ---- the eight great-grandparents ----
  document.getElementById("roots").innerHTML = ROOTS.map(r =>
    `<li><b><button type="button" class="root-btn" data-id="${r[0]}">${esc(byId[r[0]].name)}</button></b><span>${esc(r[1])}</span></li>`).join("");

  // ---- questions for the family, and the holes ----
  let asked = [];
  try { asked = JSON.parse(localStorage.getItem("familyTreeAsked") || "[]"); } catch (e) {}
  const qList = document.getElementById("qList");
  qList.innerHTML = QUESTIONS.map(g => `<div class="q-group"><h4>${esc(g.who)}</h4><ul>${g.items.map(q =>
    `<li><label><input type="checkbox" data-q="${esc(q[0])}"${asked.includes(q[0]) ? " checked" : ""}><span>${esc(q[1])}</span></label></li>`).join("")}</ul></div>`).join("");
  qList.addEventListener("change", () => {
    const done = [...qList.querySelectorAll("input:checked")].map(i => i.dataset.q);
    try { localStorage.setItem("familyTreeAsked", JSON.stringify(done)); } catch (e) {}
  });
  document.getElementById("holeList").innerHTML = HOLES.map(h =>
    `<div class="q-group"><h4>${esc(h[0])}</h4><ul class="todo">${h[1].map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`).join("");

  // ---- moves between countries ----
  document.getElementById("moves").innerHTML = MOVES.map(m =>
    `<li><b>${esc(m.when)} · ${esc(m.from)} → ${esc(m.to)}</b><span>${esc(m.text)}${m.unverified ? ' <span class="unv">not verified</span>' : ""}</span></li>`).join("");

  // ---- reading panel ----
  function renderPanel(p) {
    const photo = p.photo ? `<div class="p-photo"><div class="p-frame">${photoHtml(p, 84, p.photo.panel || null)}</div><small>Photo: ${esc(p.photo.credit)}</small></div>` : "";
    const facts = p.facts.length ? `<section><h3>Records</h3><dl class="facts">${p.facts.map(f =>
      `<dt>${esc(f[0])}</dt><dd>${esc(f[1])}<small>${esc(f[2] || "")}${f[3] ? '<span class="unv">not verified</span>' : ""}</small></dd>`).join("")}</dl></section>` : "";
    const gallery = p.gallery ? `<section><h3>Photographs</h3><div class="gal">${p.gallery.map(g =>
      `<figure><img src="${esc(g.img ? PHOTOS[g.img] : g.src)}" alt="${esc(g.caption)}" loading="lazy"><figcaption>${esc(g.caption)}<small>${esc(g.credit)}</small></figcaption></figure>`).join("")}</div></section>` : "";
    const fams = FAMILIES.filter(f => f.a === p.id || f.b === p.id);
    const kids = fams.map(fam => {
      const other = byId[fam.a === p.id ? fam.b : fam.a];
      const title = fams.length > 1 && other ? "Children with " + other.short.split(" ")[0] : "Children";
      if (!fam.all.length) return `<section><h3>Marriage to ${esc(other.short.split(" ")[0])} · ${esc(fam.count)}</h3><p class="kids-note" style="margin-top:0">${esc(fam.note || "")}</p></section>`;
      return `<section><h3>${esc(title)} · ${esc(fam.count)}</h3><ul class="kids">${fam.all.map(k =>
        `<li><button type="button" data-id="${k}">${esc(byId[k].name)}</button><span>${esc(life(byId[k]))}${LINE.has(k) ? " · your line" : ""}</span></li>`).join("")}</ul>${fam.note ? `<p class="kids-note">${esc(fam.note)}</p>` : ""}</section>`;
    }).join("");
    const pl = PLACES[p.id] && PLACES[p.id].rows.length ? `<section><h3>Places</h3><dl class="facts">${PLACES[p.id].rows.map(r =>
      `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl></section>` : "";
    const links = p.links.length ? `<section><h3>Links</h3><ul class="linklist">${p.links.map(k =>
      `<li><a href="${esc(SRC[k][1])}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a></li>`).join("")}</ul></section>` : "";
    panelInner.innerHTML = `
      <div class="p-head">${photo}<div>
        <h2>${esc(p.name)}</h2>
        ${p.nee ? `<div class="nee">née ${esc(p.nee)}. Her surname at birth was ${esc(p.nee)}.</div>` : ""}
        <div class="yrs">${esc(life(p))}</div>
        <div class="p-badges"><span class="badge">${esc(place(p))}</span>${p.likely ? '<span class="badge">Likely, not proved</span>' : ""}${p.notable ? `<span class="badge gold">${STAR}${esc(p.notable)}</span>` : ""}</div>
      </div></div>
      <div class="relbox">
        <div class="big">${p.id === "tim" ? "You" : "Your " + esc(p.rel.toLowerCase())}</div>
        <div class="plain">${esc(p.plain)}</div>
        ${p.chain ? `<div class="chain">${esc(p.chain)}</div>` : ""}
      </div>
      <section class="bio">${p.bio.map(t => `<p>${esc(t)}</p>`).join("")}</section>
      ${pl}${gallery}${kids}${facts}${links}`;
    panelInner.querySelectorAll(".gal img").forEach(img => img.addEventListener("error", () => img.closest("figure").remove()));
    panelInner.querySelectorAll(".p-photo img").forEach(img => img.addEventListener("error", () => img.closest(".p-photo").remove()));
  }

  // The panel for a box: all the brothers and sisters of one ancestor, in one place.
  function renderBoxPanel(c) {
    const kids = c.members.map(k => byId[k]);
    const fam = FAMILIES.find(f => (f.clusters || []).includes(c.id));
    const anc = fam ? byId[fam.kids.find(k => LINE.has(k)) || fam.kids[0]] : null;   // the ancestor they grew up with
    const count = kids.reduce((t, k) => t + (k.many || 1), 0);
    const aunts = /aunt/i.test(c.rel), uncles = /uncle/i.test(c.rel);
    const words = aunts && uncles ? (count === 2 ? "brother and sister" : "brothers and sisters") : aunts ? (count === 1 ? "sister" : "sisters") : (count === 1 ? "brother" : "brothers");
    const segs = kids[0].chain ? kids[0].chain.split(" → ") : [];
    const chain = !segs.length ? "" : count === 1 ? kids[0].chain : ["They", "their " + segs[1].replace(/^(his|her|their) /, "")].concat(segs.slice(2)).join(" → ");
    const links = [...new Set(kids.flatMap(k => k.links))];
    panelInner.innerHTML = `
      <div class="p-head"><div>
        <h2>${esc(c.title)}</h2>
        <div class="yrs">${count} ${count === 1 ? "person" : "people"}</div>
      </div></div>
      <div class="relbox">
        <div class="big">Your ${esc(c.rel.toLowerCase())}</div>
        <div class="plain">${esc(c.plain || (anc ? `The ${words} of ${anc.name}.` : ""))}</div>
        ${chain ? `<div class="chain">${esc(chain)}</div>` : ""}
      </div>
      <div class="sibs">${kids.map(k => {
        const src = [...new Set(k.facts.map(f => f[2]).filter(Boolean))];
        return `<section class="sib"><h4>${esc(k.name)}</h4><div class="when">${esc(k.years)}</div>${k.bio.map(t => `<p>${esc(t)}</p>`).join("")}${src.length ? `<small class="src">Source: ${esc(src.join("; "))}${k.facts.some(f => f[3]) ? '<span class="unv">not verified</span>' : ""}</small>` : ""}</section>`;
      }).join("")}</div>
      ${links.length ? `<section><h3>Links</h3><ul class="linklist">${links.map(k => `<li><a href="${esc(SRC[k][1])}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a></li>`).join("")}</ul></section>` : ""}`;
  }

  let current = "tim";
  // Pick a person or a box. A direct ancestor lights the line from that person down to Tim.
  // A box of brothers and sisters, or another relative, only opens the panel. The choice takes a mark while the panel is open.
  function select(id, opts = {}) {
    if (byId[id] && byId[id].mini) id = byId[id].cluster;   // a brother or a sister opens the box of the whole family
    const box = clById[id], p = box ? null : byId[id];
    if (!box && !p) return;
    current = id;
    const direct = !!p && LINE.has(id) && id !== "tim";
    canvas.querySelectorAll(".card").forEach(c => {
      c.classList.toggle("sel", c.dataset.id === id);
      c.classList.toggle("on-path", direct && p.path.includes(c.dataset.id));
    });
    canvas.querySelectorAll(".cluster").forEach(c => { c.classList.remove("on-path"); c.classList.toggle("sel", c.dataset.cluster === id); });
    canvas.classList.toggle("has-sel", direct);
    const at = box || p;
    if (box) renderBoxPanel(box); else     renderPanel(p);
    panel.scrollTop = 0;
    if (opts.open) {
      setPanel(true);
      // keep the chosen card clear of the panel
      const el = canvas.querySelector(`.card[data-id="${id}"], .cluster[data-cluster="${id}"]`);
      if (el && !opts.reveal && getComputedStyle(panel).position === "fixed") {
        const free = window.innerWidth - panel.offsetWidth - 16, r = el.getBoundingClientRect();
        if (r.right > free) treeScroll.scrollBy({ left: r.right - free, behavior: "smooth" });
      }
    }
    if (opts.reveal) {
      const left = (X(at.col) + CARD_W / 2) * zoom - treeScroll.clientWidth / 2;
      const top = (Y(at.row) + CARD_H / 2) * zoom - treeScroll.clientHeight / 2;
      treeScroll.scrollTo({ left: Math.max(0, left), top: Math.max(0, top), behavior: "smooth" });
      const box = treeScroll.getBoundingClientRect();
      if (box.top < 0 || box.top > window.innerHeight * 0.6) treeScroll.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-id]");
    if (el) select(el.dataset.id, { open: true, reveal: !el.closest(".canvas") });
  });
  // Open or close the panel. When it slides over the chart, the chart gets spare room on the right,
  // so that a card at the far right can still move clear of the panel.
  function setPanel(open) {
    panel.classList.toggle("open", open);
    const over = open && getComputedStyle(panel).position === "fixed";
    document.getElementById("sizer").style.marginRight = over ? panel.offsetWidth + "px" : "";
    setZoom(zoom, true);   // when the panel closes, the chart fills the freed width
  }
  // Closing the panel clears the choice: no line stays lit, and no name stays marked.
  function closePanel() {
    setPanel(false);
    current = "tim";
    canvas.querySelectorAll(".sel, .on-path").forEach(c => c.classList.remove("sel", "on-path"));
    canvas.classList.remove("has-sel");
    if (getComputedStyle(panel).position !== "fixed") renderPanel(byId.tim);   // a panel that stays on screen goes back to Tim
  }
  document.getElementById("panelClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

  // ---- zoom ----
  const ZMAX = 2, ZSTEP = 1.25;
  const sizer = document.getElementById("sizer");
  const zoomOutBtn = document.getElementById("zoomOut"), zoomInBtn = document.getElementById("zoomIn");
  const zoomLabel = document.getElementById("zoomLevel");
  // The smallest zoom: the chart just fills the width you can see. An open panel on the right does not count as space.
  // The chart can never be narrower than its box, so no empty space shows beside it.
  function fitZoom() {
    const left = treeScroll.getBoundingClientRect().left + treeScroll.clientLeft, edge = left + treeScroll.clientWidth;
    const over = panel.classList.contains("open") && getComputedStyle(panel).position === "fixed";
    const right = over ? Math.min(edge, window.innerWidth - panel.offsetWidth) : edge;
    return Math.min(ZMAX, Math.max(200, right - left) / W);
  }
  function setZoom(z, keepCentre = true) {
    const zmin = fitZoom();
    z = Math.min(ZMAX, Math.max(zmin, z));
    const centre = (treeScroll.scrollLeft + treeScroll.clientWidth / 2) / zoom;
    const centreY = (treeScroll.scrollTop + treeScroll.clientHeight / 2) / zoom;
    zoom = z;
    canvas.style.transform = `scale(${z})`;
    sizer.style.width = Math.ceil(W * z) + "px";
    sizer.style.height = Math.ceil(H * z) + "px";
    zoomLabel.textContent = Math.round(z * 100) + "%";
    zoomOutBtn.disabled = z <= zmin + 0.001;   // already fits: the minus button does nothing
    zoomInBtn.disabled = z >= ZMAX - 0.001;
    if (keepCentre) {
      treeScroll.scrollLeft = Math.max(0, centre * z - treeScroll.clientWidth / 2);
      treeScroll.scrollTop = Math.max(0, centreY * z - treeScroll.clientHeight / 2);
    }
    try { localStorage.setItem("familyTreeZoom", String(z)); } catch (e) {}
  }
  zoomInBtn.addEventListener("click", () => setZoom(zoom * ZSTEP));
  zoomOutBtn.addEventListener("click", () => setZoom(zoom / ZSTEP));
  // Fit: the whole width of the chart fills the space you can see.
  document.getElementById("zoomFit").addEventListener("click", () => {
    setZoom(fitZoom(), false);
    treeScroll.scrollLeft = 0;
  });
  // When the window or the pane changes width, the chart grows to fill its box again.
  let boxWidth = treeScroll.clientWidth;
  const onBoxResize = () => { const w = treeScroll.clientWidth; if (w === boxWidth) return; boxWidth = w; setZoom(zoom, true); };
  window.addEventListener("resize", onBoxResize);
  if (window.ResizeObserver) new ResizeObserver(onBoxResize).observe(treeScroll);

  // ---- the mouse wheel zooms, like a map ----
  // The point under the cursor stays where it is. A pinch on a trackpad arrives as a wheel turn with ctrlKey.
  treeScroll.addEventListener("wheel", e => {
    e.preventDefault();
    const box = treeScroll.getBoundingClientRect();
    const ox = e.clientX - box.left - treeScroll.clientLeft, oy = e.clientY - box.top - treeScroll.clientTop;
    const px = (treeScroll.scrollLeft + ox) / zoom, py = (treeScroll.scrollTop + oy) / zoom;
    const turn = Math.max(-100, Math.min(100, e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY));
    setZoom(zoom * Math.exp(-turn * (e.ctrlKey ? 0.01 : 0.002)), false);
    treeScroll.scrollLeft = Math.max(0, px * zoom - ox);
    treeScroll.scrollTop = Math.max(0, py * zoom - oy);
  }, { passive: false });

  // ---- drag the chart, like a map ----
  // A touch screen already moves the chart with a finger, so this is for a mouse or a pen.
  let drag = null, dragged = false;
  const endDrag = () => {
    if (!drag) return;
    dragged = drag.on;
    drag = null;
    treeScroll.classList.remove("dragging");
    setTimeout(() => { dragged = false; }, 0);
  };
  treeScroll.addEventListener("pointerdown", e => {
    if (e.pointerType === "touch" || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, left: treeScroll.scrollLeft, top: treeScroll.scrollTop, on: false, id: e.pointerId };
  });
  treeScroll.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on) {
      if (Math.hypot(dx, dy) < 8) return;   // a small wobble is still a click
      drag.on = true;
      drag.x = e.clientX; drag.y = e.clientY;   // start the move from here, so the chart does not jump
      treeScroll.classList.add("dragging");
      try { treeScroll.setPointerCapture(drag.id); } catch (err) {}
      return;
    }
    e.preventDefault();
    treeScroll.scrollLeft = drag.left - dx;
    treeScroll.scrollTop = drag.top - dy;
  });
  // listen on the window, so a release outside the chart also ends the drag
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  // the click that ends a drag must not pick a card
  treeScroll.addEventListener("click", e => { if (dragged) { e.stopPropagation(); e.preventDefault(); } }, true);
  treeScroll.addEventListener("dragstart", e => e.preventDefault());

  // ---- ancestors not found: empty boxes on or off ----
  const gapsBtn = document.getElementById("gapsBtn");
  gapsBtn.textContent = "Missing ancestors · " + GAPS.length;
  gapsBtn.setAttribute("aria-pressed", String(wide));
  gapsBtn.addEventListener("click", () => {
    wide = !wide;
    try { localStorage.setItem("familyTreeGaps2", wide ? "1" : "0"); } catch (e) {}
    gapsBtn.setAttribute("aria-pressed", String(wide));
    setLayout(wide);
    drawChart(wide);
    setZoom(zoom, false);
    select(current);
    const me = byId[current] || clById[current];
    treeScroll.scrollLeft = Math.max(0, CX(me.col) * zoom - treeScroll.clientWidth / 2);
  });

  // ---- light or dark ----
  // A click sets data-theme on the page and saves the choice. With no choice, the page follows the device.
  const themeBtns = document.querySelectorAll(".theme button");
  const deviceDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function showTheme() {
    const set = document.documentElement.getAttribute("data-theme");
    const dark = set ? set === "dark" : !!(deviceDark && deviceDark.matches);
    themeBtns.forEach(b => b.setAttribute("aria-pressed", String((b.dataset.themeSet === "dark") === dark)));
  }
  themeBtns.forEach(b => b.addEventListener("click", () => {
    document.documentElement.setAttribute("data-theme", b.dataset.themeSet);
    try { localStorage.setItem("familyTreeTheme", b.dataset.themeSet); } catch (e) {}
    showTheme();
  }));
  if (deviceDark && deviceDark.addEventListener) deviceDark.addEventListener("change", showTheme);
  showTheme();

  // ---- direct line or all children ----
  const modeBtns = document.querySelectorAll(".modes button");
  function setMode(mode) {
    canvas.classList.toggle("direct-only", mode === "direct");
    modeBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
    try { localStorage.setItem("familyTreeMode", mode); } catch (e) {}
  }
  modeBtns.forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  let savedMode = null;
  try { savedMode = localStorage.getItem("familyTreeMode"); } catch (e) {}
  setMode(savedMode === "direct" ? "direct" : "all");

  let saved = NaN;
  try { saved = parseFloat(localStorage.getItem("familyTreeZoom")); } catch (e) {}
  setZoom(saved > 0 ? saved : 1, false);

  select("tim");
  treeScroll.scrollLeft = Math.max(0, CX(byId.tim.col) * zoom - treeScroll.clientWidth / 2);
  treeScroll.scrollTop = treeScroll.scrollHeight;

}
</script>
<script>
(function () {

const SHA_K = [], SHA_H = [];
(function () {
  const frac = x => ((x - Math.floor(x)) * 4294967296) | 0;
  for (let n = 2; SHA_K.length < 64; n++) {
    let prime = true;
    for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }

    SHA_K.push(frac(Math.pow(n, 1 / 3)));
  }
})();
function sha256(bytes) {

  dv.setUint32(padLen - 8, Math.floor(l / 536870912)); dv.setUint32(padLen - 4, (l << 3) >>> 0);
  let h0 = SHA_H[0], h1 = SHA_H[1], h2 = SHA_H[2], h3 = SHA_H[3], h4 = SHA_H[4], h5 = SHA_H[5], h6 = SHA_H[6], h7 = SHA_H[7];
  const w = new Int32Array(64);
  for (let off = 0; off < padLen; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getInt32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const x = w[i - 15], y = w[i - 2];
      const s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
      const s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const t1 = (h + S1 + ((e & f) ^ (~e & g)) + SHA_K[i] + w[i]) | 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0;
    h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;

  const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toHex = b => Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
  const fromHex = h => Uint8Array.from(h.match(/../g) || [], x => parseInt(x, 16));
  const utf8 = s => new TextEncoder().encode(s);
  const salt = fromB64(V.salt), nonce = fromB64(V.nonce), tag = fromB64(V.tag), ct = fromB64(V.ct);
  const STORE = "family-tree-key-v1";
  const lock = document.getElementById("lock"), app = document.getElementById("app");
  const form = document.getElementById("lockForm"), input = document.getElementById("lockPw");
  const btn = document.getElementById("lockBtn"), msg = document.getElementById("lockMsg");

  // The browser's own crypto makes the key fast. Without it, the plain code above does the same work.
  async function makeKey(password) {
    const pw = utf8(cleanPassword(password));
    try {
      if (window.crypto && crypto.subtle) {
        const k = await crypto.subtle.importKey("raw", pw, "PBKDF2", false, ["deriveBits"]);
        return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: V.iter, hash: "SHA-256" }, k, 256));
      }
    } catch (e) {}
    return pbkdf2(pw, salt, V.iter);
  }
  function open(master) {
    const all = new Uint8Array(salt.length + nonce.length + ct.length);
    all.set(salt); all.set(nonce, salt.length); all.set(ct, salt.length + nonce.length);
    const t = hmac(hmac(master, utf8("mac")), all);
    let diff = 0;
    for (let i = 0; i < 32; i++) diff |= t[i] ^ tag[i];
    if (diff) return false;
    const D = JSON.parse(new TextDecoder().decode(xorStream(hmac(master, utf8("enc")), nonce, ct)));
    app.innerHTML = D.html;
    app.hidden = false;
    lock.remove();
    startApp(D.data);
    return true;
  }
  try { const saved = localStorage.getItem(STORE); if (saved && open(fromHex(saved))) return; } catch (e) {}
  lock.hidden = false;
  input.focus();
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (!input.value) return;
    btn.disabled = true;
    msg.textContent = "Opening. This can take a few seconds.";
    await new Promise(r => setTimeout(r, 40));
    let ok = false, master = null;
    try { master = await makeKey(input.value); ok = open(master); } catch (err) { ok = false; }
    if (ok) { try { localStorage.setItem(STORE, toHex(master)); } catch (err) {} return; }
    msg.textContent = "That password is not right. Try again.";
    btn.disabled = false;
    input.select();
  });
})();
